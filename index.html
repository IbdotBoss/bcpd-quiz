const SPECIAL = [
{id:1001,d:1,o:"1.0",q:"What will the value of the i variable be when the following loop finishes its execution?",c:"for i in range(10):\n    pass",opts:["10", "the variable becomes unavailable", "11", "9"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A `for` loop leaves its control variable holding the **last value it took**, and `range(10)` stops at 9. The variable is still in scope after the loop - Python has no block scope - which is why B is wrong."},
{id:1002,d:1,o:"1.0",q:"The following expression 1+-2 is:",c:null,opts:["equal to 1", "invalid", "equal to 2", "equal to -1"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`1+-2` parses as `1 + (-2)`. The second `-` is a unary minus attached to the 2, not a second operator, so this is perfectly valid and gives -1."},
{id:1003,d:1,o:"1.0",q:"A compiler is a program designed to",c:null,opts:["rearrange the source code to make it clearer", "check the source code in order to see if it's correct", "execute the source code", "translate the source code into machine code"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A compiler checks the source for correctness and translates it to machine code. It does not execute the result - that is the job of the program it produced - and it does not reformat your source."},
{id:1004,d:1,o:"1.0",q:"What is the output of the following piece of code?",c:"a='ant'\nb='bat'\nc='camel'\nprint(a,b,c,sep='')",opts:["ant' bat' camel", "ant'bat'camel", "antbatcamel", "SyntaxError"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`sep` controls what `print` puts *between* its arguments, and here it is set to an empty string, so the three words run together as `antbatcamel`. The default `sep` is a single space."},
{id:1005,d:1,o:"1.0",q:"What is the expected output of the following snippet?",c:"i=5\nwhile i>0:\n    i=i//2\n    if i%2==0:\n        break\n    else:\n        i+=1\nprint(i)",opts:["the code is erroneous", "3", "7", "15"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** The code runs fine and prints **2**, but none of the four options offers 2 - and option A claims the code is erroneous, which it is not. `i=5` becomes `5//2 = 2`, then `2 % 2 == 0` is true so `break` fires immediately.\n\nTraced by running it: `i = 5 // 2` is 2, and `2 % 2 == 0` is true, so `break` fires on the first pass and `print(i)` shows **2**."},
{id:1006,d:1,o:"1.0",q:"How many lines does the following snippet output?",c:"for i in range(1,3):\n    print('**',end='')\nelse:\n    print('**')",opts:["three", "one", "two", "four"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key was wrong and is corrected here.** It asks how many *lines* are printed. `print('**', end='')` runs twice and emits no newline, then the loop's `else` runs `print('**')` which does. The whole output is `******` followed by one newline - **one line**, not two.\n\n`print('**', end='')` suppresses the newline, so the two loop passes emit `****` on one line. A `while`/`for` `else` block runs when the loop finishes without `break`, adding `**` and a newline. One line of six stars."},
{id:1007,d:1,o:"1.0",q:"Which of the following literals reflect the value given as 34.23?",c:null,opts:["3.42E+01", "3.42E+01", "3.42E-03", "3.42E+05"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** Options A and B are byte-identical (`3.42E+01`) and both are keyed correct, so one of them is a typo for something else. On the content: 34.23 is 3.423E+01, so `3.42E+01` is the intended form.\n\n34.23 in scientific notation is 3.423 x 10^1, written `3.423E+01`. The exponent is the number of places the point moves."},
{id:1008,d:2,o:"2.0",q:"Assuming that the following snippet has been successfully executed, which of the equations are True?",c:"a=[1]\nb=a\na[0]=0",opts:["len(a)==len(b)", "b[0]+1==a[0]", "a[0]==b[0]", "a[0]+1==b[0]"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`b = a` does not copy - both names point at the same list. Changing `a[0]` changes what `b[0]` shows, so the two are always equal and always the same length."},
{id:1009,d:2,o:"2.0",q:"Assuming that the following snippet has been successfully executed, which of the equations are False?",c:"a=[0]\nb=a[:]\na[0]=1",opts:["len(a)==len(b)", "a[0]-1==b[0]", "a[0]==b[0]", "b[0]-1==a[0]"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`b = a[:]` **does** copy, so the two lists are now independent. Setting `a[0] = 1` leaves `b[0]` at 0, which makes `a[0] == b[0]` false and `b[0] - 1 == a[0]` false (that would be -1 == 1)."},
{id:1010,d:2,o:"2.0",q:"Which of the following statements are false?",c:null,opts:["Python strings are actually lists", "Python strings can be concatenated", "Python strings can be sliced like lists", "Python strings are mutable"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Strings are their own type, not lists, and they are **immutable** - you cannot assign to `s[0]`. They can be concatenated and sliced, which is what makes them feel list-like."},
{id:1011,d:2,o:"2.0",q:"Which of the following sentences are true?",c:null,opts:["Lists may not be stored inside tuples", "Tuples may be stored inside lists", "Tuples may not be stored inside tuples", "Lists may be stored inside lists"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Lists and tuples can each hold the other, and can nest inside themselves. The only real restriction is the other way round: a *list* cannot be a dictionary key or a set member, because it is mutable and therefore unhashable."},
{id:1012,d:2,o:"2.0",q:"Assuming that String is six or more letters long, the following slice string[1:-2] is shorter than the original string by:",c:null,opts:["four chars", "three chars", "one char", "two chars"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`[1:-2]` drops one character from the front and two from the end - three in total. Negative indices count back from the end, and the stop is exclusive."},
{id:1013,d:2,o:"2.0",q:"What is the expected output of the following snippet?",c:"lst=[1,2,3,4]\nlst=lst[-3:-2]\nlst=lst[-1]\nprint(lst)",opts:["1", "4", "2", "3"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Run it: `lst[-3:-2]` takes one element, the third from the end, giving `[2]`. Then `lst[-1]` on that one-element list is the element itself, `2`."},
{id:1014,d:5,o:"5.0",q:"What is the expected output of the following snippet?",c:"s='abc'\nfor i in len(s):\n    s[i]=s[i].upper()\nprint(s)",opts:["abc", "The code will cause a runtime exception", "ABC", "123"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`len(s)` is an integer and integers are not iterable, so `for i in len(s)` raises `TypeError` before anything else happens. You want `for i in range(len(s))` - and even then, strings are immutable so `s[i] = ...` would fail too."},
{id:1015,d:2,o:"2.0",q:"How many elements will the list2 list contain after execution of the following snippet?",c:"list1=[False for i in range(1,10)]\nlist2=list1[-1:1:-1]",opts:["zero", "five", "seven", "three"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`list1` has 9 elements, indices 0 to 8. `[-1:1:-1]` starts at index 8 and steps backwards, stopping *before* index 1, so it takes 8, 7, 6, 5, 4, 3, 2 - **seven**."},
{id:1016,d:2,o:"2.0",q:"What would you use instead of XXX if you want to check whether a certain key exists in a dictionary called dict?",c:null,opts:["'key' in dict", "dict['key'] != None", "dict.exists('key')", "'key' in dict.keys()"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`in` on a dictionary tests its **keys**, so `'key' in dict` is the idiomatic form; `'key' in dict.keys()` does the same thing more slowly. There is no `.exists()`, and comparing to `None` fails when the stored value genuinely is `None`."},
{id:1017,d:2,o:"2.0",q:"You need data which can act as a simple telephone directory. You can obtain it with the following clauses",c:null,opts:["dir={'Mom':5551234567,'Dad':5557654321}", "dir={'Mom':'5551234567','Dad':'5557654321'}", "dir={Mom:5551234567,Dad:5557654321}", "dir={Mom:'5551234567',Dad:'5557654321'}"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Dictionary **keys** must be written as values - here quoted strings. Without the quotes, `Mom` is a name Python tries to look up, and raises `NameError`. Both keyed options quote the keys; whether the numbers are strings or ints is free choice."},
{id:1018,d:4,o:"4.0",q:"Can a module run like regular code?",c:null,opts:["yes, and it can differentiate its behaviour between the regular launch and import", "it depends on the Python version", "yes, but it cannot differentiate its behaviour between the regular launch and import", "no, it is not possible; a module can be imported, not run"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A module is just a Python file, so it can be run directly. The `__name__` variable is `'__main__'` when it is run and the module's own name when it is imported, which is exactly how a file tells the two apart."},
{id:1019,d:1,o:"1.0",q:"Select the valid fun() invocations:",c:"def fun(a,b=0):\n    return a*b",opts:["fun(b=1)", "fun(a=0)", "fun(b=1,0)", "fun(1)"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`b` has a default so it may be omitted, but `a` has none and must be supplied. `fun(b=1)` leaves `a` unset. `fun(b=1, 0)` is a syntax error - a positional argument can never follow a keyword one."},
{id:1020,d:4,o:"4.0",q:"A file name like services.cpython-36.pyc says that:",c:null,opts:["the interpreter used to generate the file is version 3.6", "it has been produced by CPython", "it is the 36th version of the file", "the file comes from the services.py source file"],ans:[0, 1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"The name encodes three things: the source file (`services.py`), the implementation that compiled it (CPython) and that implementation's version (3.6). It is not a revision number."},
{id:1021,d:5,o:"5.0",q:"What is the expected behaviour of the following snippet?",c:"def a(l,l):\n    return l[l]\nprint(a(0,[1]))",opts:["cause a runtime exception", "print 1", "print 0, [1]", "SyntaxError"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Two parameters with the same name is a `SyntaxError`, caught when the file is compiled - so this fails before any line runs. That is why D is right and A (a *runtime* exception) is not."},
{id:1022,d:4,o:"4.0",q:"What can you do if you don't like a long package path like import alpha.beta.gamma.delta.epsilon.zeta?",c:null,opts:["you can make an alias for the name using the alias keyword", "nothing, you need to come to terms with it", "you can shorten it to alpha.zeta and Python will find the proper connection", "you can make an alias for the name using the as keyword"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`import a.b.c as short` binds the shorter name. There is no `alias` keyword, and Python will not guess at a shortened path."},
{id:1023,d:2,o:"2.0",q:"What is the expected output of the following code?",c:"str='abcdef'\ndef fun(s):\n    del s[2]\n    return s\nprint(fun(str))",opts:["abcef", "The program will cause a runtime exception/error", "acdef", "abdef"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Strings are immutable, so `del s[2]` raises `TypeError: 'str' object doesn't support item deletion`. To remove a character, build a new string: `s[:2] + s[3:]`."},
{id:1024,d:1,o:"1.0",q:"What is the expected output of the following code?",c:"def f(n):\n    if n==1:\n        return '1'\n    return str(n)+f(n-1)\nprint(f(2))",opts:["21", "12", "3", "1"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`f(2)` returns `str(2) + f(1)`, and `f(1)` returns `'1'`. String concatenation, not addition, so the result is the text `21`."},
{id:1025,d:1,o:"1.0",q:"What is the expected behaviour of the following snippet?",c:"def x():\n    return 2\nx=1+x()\nprint(x)",opts:["cause a runtime exception on line 02", "cause a runtime exception on line 01", "cause a runtime exception on line 03", "print 3"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The `def` runs first and binds `x` to the function; then `x = 1 + x()` calls it while the name still refers to the function, gets 2, adds 1, and rebinds `x` to 3. Rebinding a name is always legal in Python."},
{id:1026,d:1,o:"1.0",q:"What is the expected behaviour of the following code?",c:"def f(n):\n    for i in range(1,n+1):\n        yield i\nprint(f(2))",opts:["print 4321", "print <generator object f at (some hex digits)>", "cause a runtime exception", "print 1234"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A function containing `yield` is a **generator function**. Calling it does not run the body - it returns a generator object, which is what gets printed. You would need `list(f(2))` or a `for` loop to see the values."},
{id:1027,d:1,o:"1.0",q:"If you need a function that does nothing, what would you use instead of XXX?",c:"def idler(): XXX",opts:["pass", "return", "exit", "None"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Both `pass` and `return` are valid single-statement bodies. `pass` is the explicit do-nothing statement; a bare `return` exits immediately, also returning `None`. `exit` would end the program and `None` is a value, not a statement."},
{id:1028,d:3,o:"3.0",q:"Is it possible to safely check if a class/object has a certain attribute?",c:null,opts:["yes, by using the hashtart attribute", "yes, by using the hashtart() method", "yes, by using the hasattr() function", "no, it is not possible"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`hasattr(obj, 'name')` returns True or False without raising, which is what makes it the safe check. The alternative is `getattr(obj, 'name', default)`."},
{id:1029,d:3,o:"3.0",q:"The first parameter of each method:",c:null,opts:["holds a reference to the currently processed object", "is always set to None", "is set to a unique random value", "is set by the first argument's value"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The first parameter receives the instance the method was called on, conventionally named `self`. `obj.method()` is shorthand for `Class.method(obj)`."},
{id:1030,d:3,o:"3.0",q:"The simplest possible class definition in Python can be expressed as:",c:null,opts:["class X:", "class X: pass", "class X: return", "class X: {}"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A class body cannot be empty, so it needs at least one statement - `pass` is the null statement that satisfies that. `class X:` alone is a syntax error."},
{id:1031,d:5,o:"5.0",q:"How to handle an exception and assign it to variable e?",c:null,opts:["except Exception (e):", "except e = Exception:", "except Exception as e:", "such an action is not possible in Python"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`except SomeError as e:` binds the exception instance to `e`. The comma form was Python 2 and is now a syntax error."},
{id:1032,d:3,o:"3.0",q:"A variable stored separately in every object is called:",c:null,opts:["there are no such variables, all variables are shared among objects", "a class variable", "an object variable", "an instance variable"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"An instance variable is stored on each object separately, normally assigned as `self.x = ...` inside `__init__`. A class variable lives on the class and is shared by every instance."},
{id:1033,d:6,o:"6.0",q:"There is a stream named s open for writing. What option will you select to write a line to the stream?",c:null,opts:["s.write('Hello\\n')", "write(s,'Hello')", "s.writeln('Hello')", "s.writeln('Hello')"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"Options C and D are identical, so one is a typo. It does not affect the answer: there is no `writeln` in Python at all.\n\nFile objects have `write()`, which adds nothing of its own - you supply the newline. There is no `writeln` in Python."},
{id:1034,d:6,o:"6.0",q:"You are going to read just one character from a stream called s. Which statement would you use?",c:null,opts:["ch = read(s,1)", "ch = s.input(1)", "ch = input(s,1)", "ch = s.read(1)"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`read(n)` reads at most n characters, so `s.read(1)` gets exactly one. `input()` reads from the keyboard, not from a file object."},
{id:1035,d:6,o:"6.0",q:"What can you deduce from the following statement?",c:"str = open('file.txt','rt')",opts:["str is a string read in from the file named file.txt", "a newline character translation will be performed during the reads", "if file.txt does not exist, it will be created", "the opened file cannot be written with the use of the str variable"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`'rt'` is read + text mode. Text mode translates newlines on the way in, and read mode means the object cannot be written through. Opening for reading never creates a missing file - it raises `FileNotFoundError`."},
{id:1036,d:3,o:"3.0",q:"The following class hierarchy is given. What is the expected output of the code?",c:"class A:\n    def a(self):\n        print('A',end=' ')\n    def b(self):\n        self.a()\n...\nB().do()\nC().do()",opts:["BB", "CC", "AA", "BC"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`b()` finds `b` on the base class, which calls `self.a()`. Because `self` is the *subclass* instance, the subclass's own `a` runs - so each class prints its own letter. That is polymorphism through the method resolution order."},
{id:1037,d:6,o:"6.0",q:"What does the open() function return?",c:null,opts:["an integer value identifying an opened file", "an error code (0 means success)", "a stream object", "always None"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`open()` returns a file object, also called a stream. Errors are reported by raising, not by a return code."},
{id:1038,d:1,o:"1.0",q:"Which of the following words can be used as a variable name?",c:null,opts:["for", "TRUE", "TRUE", "For"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**Options B and C are identical** (`TRUE`), so one is a typo for something else. The answer still holds: `for` is a reserved keyword and cannot be a name, while `TRUE` and `For` are ordinary identifiers - Python's boolean is spelled `True`, so `TRUE` is just a name, and names are case-sensitive.\n\n`for` is a reserved keyword, so it cannot be a name. `For` is a different identifier - names are case-sensitive - and `TRUE` is an ordinary name too, since Python's boolean is spelled `True`."},
{id:1039,d:1,o:"1.0",q:"Python strings can be 'glued' together using the operator:",c:null,opts:["&", "*", "\",", "+"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`+` concatenates strings. `*` repeats one (`'ab' * 3`), and `&` is bitwise AND, which strings do not support."},
{id:1040,d:1,o:"1.0",q:"A keyword",c:null,opts:["can be used as an identifier", "is defined by Python's lexis", "is also known as a reserved word", "cannot be used in the user's code"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A keyword is part of the language's own lexis - a reserved word - so it cannot be used as an identifier. It very much does appear in your code; that is the point of `if`, `for` and `def`."},
{id:1041,d:1,o:"1.0",q:"How many stars (*) does the snippet print?",c:"S='***********'\nprint(s)",opts:["the code is erroneous", "five", "four", "None (11 stars)"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Python is case-sensitive, so `S` and `s` are different names. `S` was assigned, `s` never was, and `print(s)` raises `NameError`."},
{id:1042,d:1,o:"1.0",q:"Assuming that V holds integer 2, which operator should be used instead of OPER to make V OPER 1 equal to 1?",c:null,opts:["<<<", ">>>", ">>", "<<"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`>>` shifts bits right, and shifting binary 10 (decimal 2) right by one gives binary 1. There is no `>>>` operator in Python."},
{id:1043,d:1,o:"1.0",q:"How many stars (*) does the following snippet print?",c:"i=3\nwhile i>0:\n    i-=1\n    print('*')\nelse:\n    print('*')",opts:["the code is erroneous", "five", "three", "four"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The loop runs three times, printing a star each pass, and the `else` clause runs once when the loop ends without `break` - four stars in total. Verified by running it."},
{id:1044,d:1,o:"1.0",q:"UNICODE is:",c:null,opts:["the name of an operating system", "a standard for encoding and handling texts", "the name of a programming language", "the name of a text processor"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Unicode is a standard that assigns a number, called a code point, to every character in every writing system, plus encodings such as UTF-8 that store those numbers as bytes."},
{id:1045,d:2,o:"2.0",q:"Which of the listed actions can be applied to the following tuple?",c:"tup=()",opts:["tup[0]", "tup.append(0)", "tup[0]", "del tup"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** Options A and C are identical (`tup[0]`), and one of them is keyed correct. On an *empty* tuple `tup[0]` raises `IndexError`, so it cannot be applied at all; `del tup` genuinely can.\n\nA tuple is immutable, so there is no `append` and no item assignment. `del tup` deletes the whole name, which is always allowed."},
{id:1046,d:2,o:"2.0",q:"Executing the snippet dct={'pi':3.14}; dct['pi']=3.1415 will cause the dct:",c:null,opts:["to hold two keys named 'pi' linked to 3.14 and 3.1415 respectively", "to hold two key named 'pi' linked to 3.14 and 3.1415", "to hold one key named 'pi' linked to 3.1415", "to hold two keys named 'pi' linked to 3.1415"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A dictionary key is unique. Assigning to an existing key replaces its value rather than adding a second entry, so the dictionary still has one key."},
{id:1047,d:2,o:"2.0",q:"How many elements will the list1 list contain after execution of the following snippet?",c:"list1 = 'don't think twice, do it!'.split(',')",opts:["two", "zero", "one", "three"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`split(',')` cuts at each comma. The text has one comma, so it produces two pieces. Splitting always yields one more piece than the number of separators found."},
{id:1048,d:1,o:"1.0",q:"Which of the equations are True?",c:null,opts:["chr(ord(x)) == x", "ord(ord(x)) == x", "chr(chr(x)) == x", "ord(chr(x)) == x"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`ord()` turns a character into its code point and `chr()` turns a code point back into a character, so each undoes the other. The other two combinations pass the wrong type in."},
{id:1049,d:2,o:"2.0",q:"If you want to transform a string into a list of words, what invocation would you use? (Expected output: The, Catcher, in, the Rye,)",c:"S='The Catcher in the Rye'\nL=# put proper invocation",opts:["s.split()", "split(s,' ')", "s.split(' ')", "split(s)"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`split()` with no argument splits on any run of whitespace and discards empty pieces, which is what you want for words. It is a *method* on the string, so `s.split()` - there is no bare `split()` function."},
{id:1050,d:2,o:"2.0",q:"Assuming that lst is a four-element list, is there any difference between these two statements?\ndel lst\ndel lst[:]",c:null,opts:["yes, the first line empties the list, the second deletes the list as a whole", "yes, the first line deletes the list as a whole, the second just empties the list", "no, there is no difference", "yes, the first line deletes the list as a whole, the second removes all elements except the first"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`del lst` removes the name entirely, so using it afterwards raises `NameError`. `del lst[:]` deletes every element through a slice, leaving an empty list still bound to the name."},
{id:1051,d:4,o:"4.0",q:"What should you put instead of XXX to print out the module name?",c:"if __name__ != 'XXX':\n    print(__name__)",opts:["main", "_main", "__main__", "_main_"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Python sets `__name__` to the string `'__main__'` in the file being run directly, and to the module's own name when it is imported. Note the two underscores on each side."},
{id:1052,d:4,o:"4.0",q:"Files with the suffix .py contain:",c:null,opts:["Python source code", "backups", "temporary data", "semi-compiled Python code"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`.py` is Python source. `.pyc` holds the semi-compiled bytecode, which is what D describes."},
{id:1053,d:4,o:"4.0",q:"Package source directories/folders can be:",c:null,opts:["converted into the so-called pycK format", "packed as a ZIP file and distributed as one file", "rebuilt to a flat form and distributed as one directory/folder", "removed as Python compiles them into an internal portable format"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A package is a directory tree, and it can be zipped and shipped as one file - which is what a wheel is underneath."},
{id:1054,d:4,o:"4.0",q:"What can you deduce from the line below?",c:"x = a.b.c.f()",opts:["import a.b.c should be placed before that line", "f() is located in subpackage c of subpackage b of package a", "the line is incorrect", "the function being invoked is called a.b.c.f()"],ans:[0, 1, 3],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"The stem says choose two, but the bank keys three (A, B and D). All three are in fact correct, so the count in the stem is the error.\n\n`x = a.b.c.f()` calls `f` from subpackage `c`, inside `b`, inside package `a`, so the full dotted path is the function's name and the package has to be imported first for the lookup to resolve."},
{id:1055,d:1,o:"1.0",q:"A two-parameter lambda function raising its first parameter to the power of the second parameter should be declared as:",c:null,opts:["lambda (x,y) = x**y", "lambda (x,y): x**y", "def lambda (x,y): return x**y", "lambda x, y: x**y"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A lambda is written `lambda params: expression` - no parentheses around the parameters, no `return`, no `def`. The expression's value is what it returns."},
{id:1056,d:1,o:"1.0",q:"What is the expected output of the following code?",c:"def f(n):\n    if n==1:\n        return 1\n    return n+f(n-1)\nprint(f(2))",opts:["21", "12", "3", "none"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`f(2)` returns `2 + f(1)`, and `f(1)` hits the base case and returns 1. These are numbers, so it adds to **3** - compare with the near-identical question that concatenates strings and gives `21`."},
{id:1057,d:5,o:"5.0",q:"What is the expected output of the following code?",c:"lst=[x for x in range(5)]\nlst=list(filter(lambda x: x%2==0, lst))\nprint(len(lst))",opts:["2", "The code will cause a runtime exception", "1", "SyntaxError"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** `[x for x in range(5)]` is `[0,1,2,3,4]`; filtering for `x % 2 == 0` keeps 0, 2 and 4, so `len` is **3**. No option offers 3.\n\n`range(5)` is 0 to 4. Keeping the even ones leaves 0, 2 and 4, so the length is 3. Remember that 0 is even."},
{id:1058,d:5,o:"5.0",q:"What is the expected behaviour of the following code?",c:"def unclear(x):\n    if x%2==1:\n        return 0\nprint(unclear(1)+unclear(2))",opts:["print 0", "cause a runtime exception", "prints 3", "print an empty line"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The function returns 0 only when the argument is odd; with an even argument it falls off the end and returns `None`. `0 + None` raises `TypeError`. A function with a conditional `return` returns `None` on every path you did not cover."},
{id:1059,d:3,o:"3.0",q:"If any of a class's components has a name that starts with two underscores (__), then:",c:null,opts:["the class component's name will be mangled", "the class component has to be an instance variable", "the class component has to be a class variable", "the class component has to be a method"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Two leading underscores trigger **name mangling** - `__x` inside `class C` becomes `_C__x`. It prevents accidental clashes in subclasses; it is not access control, and the attribute is still reachable under the mangled name."},
{id:1060,d:5,o:"5.0",q:"If you need to serve two different exceptions called Ex1 and Ex2 in one except branch, you can write:",c:null,opts:["except Ex1 Ex2:", "except (Ex1, Ex2):", "except Ex1, Ex2:", "except Ex1+Ex2:"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Multiple exception types go in a parenthesised tuple. The bare comma form was Python 2 syntax for binding the instance and is now a syntax error."},
{id:1061,d:3,o:"3.0",q:"A function called issubclass(c1,c2) is able to check if:",c:null,opts:["c1 and c2 are both subclasses of the same superclass", "c2 is a subclass of c1", "c1 is a subclass of c2", "c1 and c2 are not subclasses of the same superclass"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`issubclass(c1, c2)` reads in argument order: is the first a subclass of the second. `isinstance` follows the same order with an object first."},
{id:1062,d:3,o:"3.0",q:"A class constructor",c:null,opts:["can return a value", "cannot be invoked directly from inside the class", "can be invoked directly from any of the subclasses", "can be invoked directly from any of the superclasses"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`__init__` runs automatically when you instantiate; you never call it directly on the class, but a subclass calls the parent's through `super().__init__()`. It must return `None`."},
{id:1063,d:3,o:"3.0",q:"The following class definition is given. We want the show() method to invoke the get() method, and then output the value the get() method returns. Which invocation should be used instead of XXX?",c:"class Class:\n    def __init__(self,val):\n        self.val=val\n    def get(self):\n        return self.val\n    def show(self):\n        XXX",opts:["print(get(self))", "print(self.get())", "print(get())", "print(self.get(val))"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Calling another method on the same object needs `self.` in front - `self.get()`. Without it Python looks for a plain function called `get` and raises `NameError`."},
{id:1064,d:6,o:"6.0",q:"If S is a stream open for reading, what do you expect from the following invocation?",c:"c = s.read()",opts:["one line of the file will be read and stored in the string called c", "the whole file content will be read and stored in the string called c", "one character will be read and stored in the string called c", "one disk sector (512 bytes) will be read and stored in the string called c"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`read()` with no argument consumes the **whole** remaining file into one string. `read(1)` gets one character and `readline()` gets one line."},
{id:1065,d:6,o:"6.0",q:"You are going to read 16 bytes from a binary file into a bytearray called data. Which lines would you use?",c:null,opts:["data=bytearray(16); bf.readinto(data)", "data=binfile.read(bytearray(16))", "bf.readinto(data=bytearray(16))", "data=bytearray(binfile.read(16))"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`readinto()` fills a buffer you already made; `read(n)` returns fresh bytes you can wrap in a `bytearray`. Both give you 16 bytes - the difference is who allocates."},
{id:1066,d:3,o:"3.0",q:"What is the expected output of the following snippet?",c:"class X: pass\nclass Y(X): pass\nclass Z(Y): pass\nX=Z()\nZ=Z()\nprint(isinstance(X,Z), isinstance(Z,X))",opts:["True False", "True True", "False False", "False True"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** `Z = Z()` rebinds the name `Z` from a class to an *instance*, so `isinstance(X, Z)` raises `TypeError: isinstance() arg 2 must be a type`. The code never prints anything, and no option says it raises.\n\n`Z = Z()` rebinds the name `Z` from the class to an instance of it, so the class is no longer reachable by that name and `isinstance(X, Z)` gets an object where it needs a type."},
{id:1067,d:4,o:"4.0",q:"Assuming that the code below has been executed successfully, which of the following expressions will always evaluate to True?",c:"import random\nrandom.seed(1)\nv1=random.random()\nrandom.seed(1)\nv2=random.random()",opts:["v1 == v2", "v1 > v2", "len(random.sample([1,2,3],2)) > 2", "random.choice([1,2,3]) >= 1"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Seeding with the same value makes the sequence repeat, so `v1 == v2` always holds. `random.choice` on `[1,2,3]` can only return one of those, all >= 1. `sample` cannot return more items than you asked for."},
{id:1068,d:4,o:"4.0",q:"Which one of the platform module functions should be used to determine the underlying platform name?",c:null,opts:["platform.python_version()", "platform.processor()", "platform.platform()", "platform.uname()"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`platform.platform()` returns the whole platform string. `uname()` returns a structured tuple, and `processor()` only the CPU."},
{id:1069,d:4,o:"4.0",q:"What is the expected output of the following code?",c:"import sys\nimport math\nb1=type(dir(math)[0]) is str\nb2=type(sys.path[-1]) is str\nprint(b1 and b2)",opts:["FALSE", "None", "TRUE", "0"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`dir()` returns a list of names as strings and `sys.path` is a list of directory strings, so both checks are true and `and` gives True. (The option is spelled `TRUE` here; Python prints `True`.)"},
{id:1070,d:4,o:"4.0",q:"With regards to the directory structure, select the proper forms of the directives in order to import module_a.",c:null,opts:["from pypack import module_a", "import module_a from pypack", "import module_a", "import pypack.module_a"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Either name the package on the way in - `from pypack import module_a` - or import the full dotted path. A bare `import module_a` only works if the module's own directory is on the path."},
{id:1071,d:4,o:"4.0",q:"A Python module named pymod.py contains a function named python(). Which of the following snippets will let you invoke the function?",c:null,opts:["import pymod; pymod.python()", "from pymod import python; python()", "from pymod import *; pymod.python()", "import python from pymod; python()"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`import pymod` binds the module, so the function is reached as `pymod.python()`. `from pymod import python` binds the function itself, so it is called bare. Option C mixes the two and would fail."},
{id:1072,d:4,o:"4.0",q:"What is true about Python packages?",c:null,opts:["a package is a single file whose name ends with the .pa extension", "a package is a group of related modules", "the __name__ variable always contains the name of a package", "the .pyc extension is used to mark semi-compiled Python packages"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A package is a group of related modules in a directory. `__name__` holds the *module's* name - and `'__main__'` in the file being run - so it is not always a package name; `.pyc` marks compiled modules, not packages."},
{id:1073,d:5,o:"5.0",q:"What is the expected behaviour of the following code?\n(try/except missing colon)",c:null,opts:["it outputs 3", "it outputs 1", "the code is erroneous and it will not execute", "it outputs 2"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A missing colon is a `SyntaxError`, raised when the file is compiled, so nothing runs at all and no output appears."},
{id:1074,d:1,o:"1.0",q:"Which function or operator should you use to obtain the answer True or False to the question: 'Do two variables refer to the same object?'",c:null,opts:["The = operator", "The isinstanceOf function", "The id() function", "The is operator"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`is` compares identity - whether two names point at the same object. `==` compares value, and `=` assigns. `id()` gives you the identity number but you would have to compare the two results yourself."},
{id:1075,d:3,o:"3.0",q:"Which sentence about the @property decorator is false?",c:null,opts:["The @property decorator should be defined after the method that is responsible for setting an encapsulated attribute.", "The @property decorator designates a method which is responsible for returning an attribute value.", "The @property decorator marks the method whose name will be used as the name of the instance attribute.", "The @property decorator should be defined before the methods that are responsible for setting and deleting an encapsulated attribute."],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`@property` goes on the **getter**, and it has to come first because the setter is then written as `@name.setter`, which refers back to the property the getter created. Defining it afterwards would have nothing to attach to."},
{id:1076,d:3,o:"3.0",q:"Select the true statement about the __name__ attribute.",c:null,opts:["__name__ is a special attribute, inherent for both classes and instances, and it contains information about the class to which a class instance belongs.", "__name__ is a special attribute, inherent for both classes and instances, and it contains a dictionary of object attributes.", "__name__ is a special attribute, inherent for classes and it contains information about the class to which a class instance belongs.", "__name__ is a special attribute, inherent for classes, and it contains the name of a class."],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`__name__` on a class holds the class's own name as a string. The attribute that tells an *instance* which class it belongs to is `__class__`, and the dictionary of attributes is `__dict__`."},
{id:1077,d:1,o:"1.0",q:"Select the true statements related to PEP 8 programming recommendations.",c:null,opts:["You should use the not ... is operator rather than the is not operator", "You should make object type comparisons using the isinstance() method", "You should write code in a way that favours the CPython implementation over PyPy, Cython, and Jython", "You should not write string literals that rely on significant trailing whitespace"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"PEP 8 says to use `isinstance()` for type comparisons and warns against trailing whitespace in literals, which is invisible and easily lost. It prefers `is not` over `not ... is`, and explicitly tells you not to favour one implementation."},
{id:1078,d:5,o:"5.0",q:"What is the expected behaviour of the following code?",c:"string=str(1/3)\ndummy=''\nfor character in strong:\n    dummy=character+dummy\nprint(dummy[-1])",opts:["it raises an exception", "it outputs 0", "it outputs 3", "it outputs None"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`strong` is a typo for `string`, and the name was never assigned, so the loop raises `NameError` before anything prints. Python only catches this when the line actually runs."},
{id:1079,d:1,o:"1.0",q:"Which of the following statements are true?",c:null,opts:["ASCII stands for Information Interchange", "a code point is a number assigned to a given character", "ASCII is synonymous with UTF-8", "\\e is an escape sequence used to mark the end of lines"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A code point is the number assigned to a character. ASCII is *American Standard Code for Information Interchange* - the option here drops the first half. UTF-8 is a Unicode encoding, not a synonym for ASCII, and `\\n` marks a line end, not `\\e`."},
{id:1080,d:2,o:"2.0",q:"Which of the following expressions evaluate to True?",c:null,opts:["str(1-1) in '123456789'", "'dcb' not in 'abcde'[::-1]", "'phd' in 'alpha'", "'True' not in 'False'"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** It asks for two true expressions, but only D is true. `str(1-1)` is `'0'`, and `'0'` does not appear in `'123456789'`, so A is false - yet A is keyed. `'abcde'[::-1]` is `'edcba'`, which does contain `'dcb'`, and `'phd'` is not in `'alpha'`.\n\n`str(1-1)` is `'0'`, which is not in `'123456789'` - so A is false as written and this key is worth checking. `'True' not in 'False'` is true: it is a substring test, and `'True'` does not appear inside `'False'`."},
{id:1081,d:2,o:"2.0",q:"What is the expected behaviour of the following code?",c:"the_list='alpha;beta;gamma'.split(':')\nthe_string='.'.join(the_list)\nprint(the_string.isalpha())",opts:["it raises an exception", "it outputs True", "it outputs False", "it outputs nothing"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`.split(':')` finds no colon, so it returns the whole string as a single-element list. Joining that gives the original text back, and `isalpha()` is False because of the semicolons."},
{id:1082,d:2,o:"2.0",q:"Assuming that the snippet below has been executed successfully, which of the following expressions evaluate to True?",c:"string='python'[::2]\nstring=string[-1]+string[-2]",opts:["string[0]=='o'", "string is None", "len(string)==3", "string[0]==string[-1]"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"The stem says choose two but the bank keys only one. A is correct: `'python'[::2]` is `'pto'`, then `string[-1] + string[-2]` is `'ot'`, so `string[0]` is `'o'`.\n\n`'python'[::2]` takes every second character - `'pto'`. Then `string[-1] + string[-2]` is `'o'` reversed onto `'t'`, giving `'ot'`, so `string[0]` is `'o'` and the length is 2."},
{id:1083,d:3,o:"3.0",q:"What is the expected behaviour of the following code?\n(missing colon after Sub_B(Super))",c:null,opts:["it outputs 0", "it outputs 1", "it raises an exception", "it outputs 2"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"A missing colon after a `class` header is a `SyntaxError`, so the file never runs."},
{id:1084,d:3,o:"3.0",q:"Assuming that the following inheritance set is in force, which of the following classes are declared properly?",c:"class A: pass\nclass B(A): pass\nclass C(A): pass\nclass D(B): pass",opts:["class Class_4(D,A): pass", "class Class_3(A,C): pass", "class Class_2(B,D): pass", "class Class_1(C,D): pass"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A class list is valid when Python can find one consistent method resolution order. Deriving from a class and its own ancestor in the wrong order is what fails - the more specific class has to come first."},
{id:1085,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Upper:\n    def method(self):\n        return 'upper'\nclass Lower(Upper):\n    def method(self):\n        return 'lower'\nObject=Upper()\nprint(isinstance(Object,Lower), end=' ')\nprint(Object.method())",opts:["True upper", "True lower", "False upper", "False lower"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`Object` is an `Upper`, and a parent is never an instance of its child, so `isinstance` is False. The method called is the one on `Upper`, printing `upper`."},
{id:1086,d:3,o:"3.0",q:"What is the expected behaviour of the following code?\n(o1.foo missing parentheses)",c:null,opts:["it outputs 1", "it outputs 3", "it outputs 6", "it raises an exception"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`o1.foo` without parentheses is the method *object*, not a call. Using it where a number is expected raises `TypeError`."},
{id:1087,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Class:\n    Variable=0\n    def __init__(self):\n        self.value=0\nobject_1=Class()\nobject_1.Variable+=1\nobject_2=Class()\nobject_2.value+=1\nprint(object_2.Variable+object_1.value)",opts:["it outputs 0", "it raises an exception", "it outputs 1", "it outputs 2"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`object_1.Variable += 1` reads the shared class attribute (0), adds one, and stores the result as a **new instance attribute** on `object_1` only. `object_2.Variable` still reads the class's 0, and `object_1.value` is its own 0, so the sum is 0."},
{id:1088,d:3,o:"3.0",q:"What is true about Object-Oriented Programming in Python?",c:null,opts:["each object of the same class can have a different set of methods", "a subclass is usually more specialised than its superclass", "if a real-life object can be described with a set of adjectives, they may reflect a Python object method", "the same class can be used many times to build a number of objects"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"Every instance of a class has the same methods - that is what the class defines. A subclass specialises its parent, and one class builds as many objects as you like."},
{id:1089,d:3,o:"3.0",q:"What is true about Python class constructors?",c:null,opts:["there can be more than one constructor in a Python class", "the constructor must return a value other than None", "the constructor is a method named __init__", "the constructor must have at least one parameter"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"The constructor is `__init__`, and its first parameter is the instance, so it always has at least one. It must return `None`, and a second `def __init__` simply replaces the first - Python has no overloading."},
{id:1090,d:3,o:"3.0",q:"Assuming that the following piece of code has been executed successfully, which of the expressions evaluate to True?",c:"class A:\n    VarA=1\n    def __init__(self):\n        self.prop_a=1\nclass B(A):\n    VarA=2\n    def __init__(self):\n        super().__init__()\n        self.prop_b=2\nobj_a=A()\nobj_aa=A()\nobj_b=B()\nobj_bb=obj_b",opts:["isinstance(obj_b,A)", "A.VarA==1", "obj_a is obj_aa", "B.VarA==1"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`obj_b` is a `B`, and `B` derives from `A`, so `isinstance(obj_b, A)` is true. `A.VarA` is still 1 - `B` shadowing it with 2 does not change the parent. `obj_a` and `obj_aa` are separate objects, so `is` is false."},
{id:1091,d:3,o:"3.0",q:"What is the expected behaviour of this code? Which are true?",c:"class Class:\n    Var=data=1\n    def __init__(self, value):\n        self.prop=value\nObject=Class(2)",opts:["len(Class.__dict__)==1", "'data' in Class.__dict__", "'var' in Class.__dict__", "'data' in Object.__dict__"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"The stem says choose two but the bank keys only one. `Var = data = 1` binds both names in the class body, so `'data' in Class.__dict__` is true.\n\n`Var = data = 1` in the class body binds **both** names on the class, so `'data'` is in `Class.__dict__`. `'var'` is not - names are case-sensitive - and `prop` lives on the instance, not the class."},
{id:1092,d:3,o:"3.0",q:"A property that stores information about a given class's super-classes is named:",c:null,opts:["__upper__", "__super__", "__ancestors__", "__bases__"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`__bases__` holds the tuple of a class's direct base classes."},
{id:1093,d:1,o:"1.0",q:"What is the expected output of the following code?",c:"myTu=('a','b','c')\nm=tuple(map(lambda x: chr(ord(x)+1), myTu))\nprint(m[-2])",opts:["a", "c", "an exception is raised", "b"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key was wrong and is corrected here.** The bank keys `b`; running it gives `c`.\n\nThe bank keys **b**. Running it: `('a','b','c')` maps through `chr(ord(x)+1)` to `('b','c','d')`, so `m[-2]` - the second from the end - is **c**."},
{id:1094,d:6,o:"6.0",q:"What is the expected behaviour of this code?",c:"try:\n    f=open('non_existing_file','w')\n    print(1,end=' ')\n    s=f.readline()\n    print(2,end=' ')\nexcept IOError as error:\n    print(3,end=' ')\nelse:\n    f.close()\n    print(4,end=' ')",opts:["124", "1234", "24", "13"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key was wrong and is corrected here.** The bank keys `124`; running it prints `1 3`.\n\nThe bank keys **124**; it actually prints **1 3**. Opening in `'w'` mode succeeds and creates the file, so `print(1)` runs. Then `readline()` on a write-only handle raises `io.UnsupportedOperation`, which subclasses `OSError` and so IS caught by `except IOError`, printing 3. The `else` never runs, because `else` means the `try` finished without an exception."},
{id:1095,d:6,o:"6.0",q:"What is the expected behaviour of this code?",c:"try:\n    f=open('existing_text_file','w')\n    d=f.readlines()\n    print(len(d))\n    f.close()\nexcept IOError:\n    print(-1)",opts:["the length of the first line from the file", "-1", "the number of lines contained inside the file", "the length of the last line from the file"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key is unusable and is corrected here.** It reads `0 (none of the above)`, which is not one of the four options.\n\nIt prints **-1**. `'w'` mode truncates the file, then `readlines()` on a write-only handle raises `io.UnsupportedOperation` - a subclass of `OSError` - so the handler catches it."},
{id:1096,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"my_list=[i for i in range(5)]\nm=[my_list[i] for i in range(4,0,-1)] if my_list[i]%2!=0]\nprint(m)",opts:["it outputs [1,3]", "the code is erroneous and it will not execute", "it outputs [3,1]", "it outputs [4,2,0]"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The comprehension has an unbalanced bracket, so it is a `SyntaxError` and nothing runs. Read the brackets rather than the logic when a snippet looks odd."},
{id:1097,d:1,o:"1.0",q:"Assuming that the following code has been executed successfully, which of the expressions evaluate to True?",c:"def f(x,y):\n    nom,denom=x,y\n    def g():\n        return nom/denom\n    return g\na=f(1,2)\nb=f(3,4)",opts:["b()==4", "a!=b", "a is not None", "a()==4"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`f` returns a new function each call, so `a` and `b` are different objects and neither is `None`. Each closure remembers its own `nom` and `denom`, so `a()` is 0.5 and `b()` is 0.75."},
{id:1098,d:1,o:"1.0",q:"What is the expected behaviour of this code?",c:"def foo(x,y):\n    return y(x)+(x+1)\nprint(foo(1, lambda x: x*x))",opts:["3", "5", "4", "an exception is raised"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`y(x)` is `1*1 = 1`, then `+ (x+1)` adds 2, giving **3**. Note the second term is not passed through the lambda - compare the near-identical question where it is."},
{id:1099,d:1,o:"1.0",q:"Which of the following lambda definitions are correct?",c:null,opts:["lambda x,y: (x,y)", "lambda x,y: return x/y - x%y", "lambda x,y: x/y - x%y", "lambda x,y = x/y - x%y"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A lambda's body is a single expression, so there is no `return` and no `=`. Returning a tuple is fine because `(x, y)` is an expression."},
{id:1100,d:6,o:"6.0",q:"Which of the following statements are true?",c:null,opts:["if invoking open() fails, an exception is raised", "open() requires a second argument", "open() is a function which returns an object that represents a physical file", "instd, outstd, errstd are the names of pre-opened streams"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`open()` raises on failure rather than returning an error code, and what it returns represents the file. The mode argument is optional and defaults to `'r'`; the pre-opened streams are `stdin`, `stdout` and `stderr`."},
{id:1101,d:1,o:"1.0",q:"What is the expected behaviour of this code?",c:"x = 3 % 1\ny = 1 if x > 0 else 0\nprint(y)",opts:["the code is erroneous and it will not execute", "it outputs 1", "it outputs -1", "it outputs 0"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`3 % 1` is 0 - one divides into three exactly, leaving no remainder. So `x > 0` is false and the conditional expression yields 0."},
{id:1102,d:5,o:"5.0",q:"Which of the following snippets will execute without raising any unhandled exceptions?",c:null,opts:["try:\n    print(float('1e1'))\nexcept (ValueError,NameError):\n    print(float('1a1'))\nelse:\n    print(float('101'))", "try:\n    print(1/1)\nexcept:\n    print(2/1)\nelse:\n    print(3/0)", "try:\n    print(1/0)\nexcept ValueError:\n    print(1/1)\nelse:\n    print(1/2)", "try:\n    print(0/1)\nexcept:\n    print(1/1)\nelse:\n    print(2/1)"],ans:[0, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A works because `float('1e1')` is valid, so no exception occurs and the `else` runs `float('101')`, also valid. D works because `0/1` is fine. B ends with `3/0` in its `else`, and C's `except ValueError` cannot catch the `ZeroDivisionError` that `1/0` raises."},
{id:1103,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Class:\n    Var=0\n    def _foo(self):\n        Class.Var+=1\n        return Class.Var\no=Class()\no._Class_foo()\nprint(o._Class_foo())",opts:["it raises an exception", "it outputs 3", "it outputs 1", "it outputs 6"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"Only a **double** underscore triggers name mangling. `_foo` has one, so it is not renamed and `o._Class_foo()` looks for an attribute that does not exist, raising `AttributeError`. Had the method been `__foo`, the mangled name would be `_Class__foo` - note the two underscores in the middle."},
{id:1104,d:1,o:"1.0",q:"What is the expected behaviour of this code?",c:"x = 8 ** (1/3)\ny = 2. if x < 2.3 else 3.\nprint(y)",opts:["the code is erroneous and it will not execute", "it outputs 2.0", "it outputs 2.5", "it outputs 3.0"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`8 ** (1/3)` is the cube root of 8, which is 2.0. `2.0 < 2.3` is true, so the conditional expression yields `2.` - and `2.` is a float literal, so it prints as `2.0`."},
{id:1105,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"my_list=[i for i in range(5,0,-1)]\nm=[my_list[i] for i in range(5)] if my_list[i]%2==0]\nprint(m)",opts:["it outputs [4,2]", "it outputs [2,4]", "it outputs [0,1,2,3,4]", "the code is erroneous and it will not execute"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"The comprehension has an unmatched `]`, so this is a `SyntaxError` and nothing runs at all. When a snippet looks strange, count the brackets before reasoning about the logic."},
{id:1106,d:3,o:"3.0",q:"The __bases__ property contains:",c:null,opts:["base class location (addr)", "base class objects (class)", "base class names (str)", "base class ids (int)"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`__bases__` holds the base **class objects** themselves, not their names or addresses. `SubClass.__bases__[0].__name__` is how you would get a name."},
{id:1107,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Super:\n    def make(self): pass\n    def doit(self):\n        return self.make()\nclass Sub_A(Super):\n    def make(self):\n        return 1\nclass Sub_B(Super):\n    pass\na=Sub_A()\nb=Sub_B()\nprint(a.doit()+b.doit())",opts:["It outputs 0", "It raises an exception", "It outputs 1", "It outputs 2"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`Sub_A` overrides `make()` and returns 1, but `Sub_B` inherits the base version, whose body is `pass` - so it returns `None`. `1 + None` raises `TypeError`."},
{id:1108,d:1,o:"1.0",q:"Which of the following statements are true?",c:null,opts:["an escape sequence can be recognised by the / sign put in front of it", "ASCII stands for Internal Information", "ASCII is a subset of UNICODE", "a code point is a number assigned to a given character"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"ASCII's 128 characters are the first 128 code points of Unicode, so it is a subset, and a code point is the number assigned to a character. An escape sequence starts with a backslash, not a slash."},
{id:1109,d:1,o:"1.0",q:"What is the expected behaviour of this code?",c:"string='123'\ndummy=0\nfor character in reversed(string):\n    dummy += int(character)\nprint(dummy)",opts:["it outputs 321", "it outputs 123", "it outputs 6", "it raises an exception"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`reversed()` walks the characters backwards, but addition does not care about order - 3 + 2 + 1 is the same 6. The reversal is a red herring."},
{id:1110,d:4,o:"4.0",q:"A Python module named pymod.py contains a variable named pymod. Which of the following snippets will let you access the variable?",c:null,opts:["import pymod; pymod.pyvar = 1", "import pymod from pymod; pymod = 1", "from pymod import pymod; pymod()", "from pymod import pymod; pymod = 1"],ans:[2, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`from pymod import pymod` binds the module's variable into your namespace, which is how you reach it. Note that rebinding that name afterwards affects only your copy, not the module's."},
{id:1111,d:1,o:"1.0",q:"Which of the following expressions evaluate to True?",c:null,opts:["ord('2') - ord('2') == ord('0')", "len('6E6E6E6E') > 0", "chr(ord('a')+1) == 'B'", "len('') == 1"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** It asks for two, but only B is true. Option A - `ord('2') - ord('2') == ord('0')` - is 0 == 48, which is **false**, and it is keyed correct. `chr(ord('a')+1)` is `'b'`, not `'B'`, and an empty string has length 0.\n\n`ord('2') - ord('2')` is 0, and `ord('0')` is 48 - so A is false as written and this key is worth checking. B is true: an eight-character string has a length above 0. `chr(ord('a')+1)` is `'b'`, not `'B'`, and an empty string has length 0."},
{id:1112,d:6,o:"6.0",q:"What is the expected behaviour of this code?",c:"try:\n    f=open('non_zero_length_existing_text_file','rt')\n    d=f.read(1)\n    print(len(d))\n    f.close()\nexcept IOError:\n    print(-1)",opts:["1", "0", "an error value corresponding to file not found", "1"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"Options A and D are identical (`1`), so one is a typo. The answer is 1: `read(1)` on a non-empty existing file returns one character, and `len` of that is 1.\n\n`read(1)` returns one character from a non-empty file, so `len(d)` is 1. The `except` branch would only run if the file were missing."},
{id:1113,d:3,o:"3.0",q:"Assuming that the code below has been executed successfully, which of the expressions evaluate to True?",c:"class Class:\n    var=1\n    def __init__(self, value):\n        self.prop=value\nObject=Class(2)",opts:["'var' in Class.__dict__", "'var' in Object.__dict__", "len(Object.__dict__) == 1", "'prop' in Class.__dict__"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`var` is defined in the class body so it lives on the class; `prop` is assigned to `self` so it lives on the instance, which therefore has exactly one entry in its `__dict__`."},
{id:1114,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"the_list='1,2 3'.split()\nthe_string=''.join(the_list)\nprint(the_string.insight())",opts:["it raises an exception", "it outputs nothing", "it outputs True", "it outputs False"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`.split()` and `.join()` both work fine, but `.insight()` is not a string method - it does not exist - so the code raises `AttributeError` before `print` gets anything. Nothing is output because the program stops there."},
{id:1115,d:4,o:"4.0",q:"Assuming that the code below has been executed successfully, which of the following expressions will always evaluate to True?",c:"import random\nv1=random.random()\nv2=random.random()",opts:["v1 == v2", "v1 < 1", "random.choice([1,2,3]) > 0", "len(random.sample([1,2,3],1)) > 2"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`random.random()` returns a float in [0.0, 1.0), so it is always below 1, and `choice` on `[1,2,3]` always returns one of those. Two unseeded calls are not expected to be equal, and `sample(seq, 1)` returns exactly one item."},
{id:1116,d:4,o:"4.0",q:"With regards to the directory structure, select the proper forms of the directives in order to import module_b.",c:null,opts:["from pyback.upper import module_b", "import pyback.upper.module_b", "import upper.module_b", "import module_b"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"The stem says choose two but the bank keys only one.\n\nThe full dotted path always works: `import pyback.upper.module_b`. A partial path like `upper.module_b` only resolves if that directory is itself on the import path."},
{id:1117,d:4,o:"4.0",q:"What is the expected behaviour of this code?",c:"import sys\nb1=type(dir(sys)) is str\nb2=type(sys.path[-1]) is str\nprint(b1 and b2)",opts:["FALSE", "0", "None", "TRUE"],ans:[0],multi:false,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key is malformed and is corrected here.** It reads `FALSE` - the option *text* rather than a letter, almost certainly Excel coercing \"False\" into a boolean. It maps to option A.\n\n`dir(sys)` returns a **list**, not a str, so `b1` is False and `b1 and b2` is False without even evaluating `b2`. That short-circuit is why `and` stops at the first falsy operand."},
{id:1118,d:3,o:"3.0",q:"What is true about Python class constructors?",c:null,opts:["there can be only one constructor in a Python class", "the constructor cannot be invoked directly under any circumstances", "the constructor cannot return a result other than None", "the constructor's first parameter must always be named self"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`__init__` is invoked for you by instantiation, never called directly, and its first parameter is conventionally `self`. A second `def __init__` replaces the first rather than overloading it."},
{id:1119,d:1,o:"1.0",q:"What is the expected behaviour of this code?",c:"def foo(x,y):\n    return y(x)+y(x+1)\nprint(foo(1, lambda x: x*x))",opts:["4", "3", "an exception is raised", "5"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`y(x)` is `1*1 = 1` and `y(x+1)` is `2*2 = 4`, so the sum is **5**. Both terms go through the lambda here - compare the near-identical question where the second does not."},
{id:1120,d:3,o:"3.0",q:"Assuming that the following inheritance set is in force, which of the following classes are declared properly?",c:"class A: pass\nclass B(A): pass\nclass C(A): pass\nclass D(B,C): pass",opts:["class Class_3(A,C): pass", "class Class_4(C,B): pass", "class Class_1(D): pass", "class Class_2(A,B): pass"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`class Class_3(A, C)` and `class Class_1(D)` both give Python a consistent method resolution order. The failing combinations put a base class before its own subclass, which cannot be linearised."},
{id:1121,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"s='2A'\ntry:\n    n=int(s)\nexcept ValueError:\n    n=2\nexcept ArithmeticError:\n    n=1\nexcept:\n    n=0\nprint(n)",opts:["it outputs 0", "the code is erroneous and it will not execute", "it outputs 1", "it outputs 2"],ans:[3],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`int('2A')` raises `ValueError`, and handlers are tried in order, so the first matching one wins and `n` becomes 2. The later branches never run."},
{id:1122,d:2,o:"2.0",q:"Which of the following expressions evaluate to True?",c:null,opts:["'in' in 'Thames'", "'in' in 'in'", "'in not' in 'not'", "'t'.upper() in 'Thames'"],ans:[1, 3],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`in` is a substring test. `'Thames'` does not contain `'in'`; `'in'` trivially contains itself; and `'t'.upper()` is `'T'`, which `'Thames'` does start with."},
{id:1123,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Class:\n    Variable=0\n    def __init__(self):\n        self.value=0\nobject_1=Class()\nClass.Variable+=1\nobject_2=Class()\nobject_2.value+=1\nprint(object_2.Variable+object_1.value)",opts:["It outputs 2", "It raises an exception", "It outputs 1", "It outputs 0"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`Class.Variable += 1` changes the attribute **on the class**, so every instance sees 1. Compare the near-identical question that writes `object_1.Variable += 1` instead - that creates a private copy on one instance and leaves the class at 0."},
{id:1124,d:2,o:"2.0",q:"Which of the following invocations are valid?",c:null,opts:["sort('python')", "'python'.find('e')", "'python'.index('eth')", "'python'.sorted()"],ans:[1, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"`find()` and `index()` are both real string methods, so both calls are valid syntax - `find` returns -1 when absent and `index` raises. There is no bare `sort()` function for strings and no `.sorted()` method; the built-in is `sorted('python')`."},
{id:1125,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class Upper:\n    def __init__(self):\n        self.property='upper'\nclass Lower(Upper):\n    def __init__(self):\n        super().__init__()\nObject=Lower()\nprint(isinstance(Object,Lower), end='')\nprint(Object.property)",opts:["True lower", "True upper", "False upper", "False lower"],ans:[1],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`Lower` derives from `Upper` and its `__init__` calls `super().__init__()`, so `property` does get set and reads `'upper'`. The object genuinely is a `Lower`, so `isinstance` is True."},
{id:1126,d:3,o:"3.0",q:"What is the expected behaviour of this code?",c:"class ClassA:\n    var=1\n    def __init__(self,prop):\n        prop1=prop2=prop\nclass ClassB(ClassA):\n    def __init__(self,prop):\n        prop3=prop**2\n        super().__init__(prop)\n    def __str__(self):\n        return 'Object'\nObject=ClassA(2)",opts:["ClassA.__module__ == '__main__'", "__name__ == '__main__'", "str(Object) == 'Object'", "len(ClassB.__bases__) == 2"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question's key was wrong and is corrected here.** `__str__` is defined on `ClassB`, but `Object` is a `ClassA`, so `str(Object)` gives the default `<__main__.ClassA object ...>` - option C is false. `ClassB.__bases__` is `(ClassA,)`, length 1, so D is false too. The two true statements are A and B.\n\n`ClassA.__module__` is `'__main__'` when the file is the one being run. Watch the `__str__`: it is defined on `ClassB`, and `Object` is a `ClassA`, so it does not apply."},
{id:1127,d:5,o:"5.0",q:"Which of the following snippets will execute without raising any unhandled exceptions?",c:null,opts:["try:\n    print(0/0)\nexcept:\n    print(0/1)\nelse:\n    print(0/2)", "try:\n    print(int('0'))\nexcept NameError:\n    print('0')\nelse:\n    print(int(''))", "import math\ntry:\n    print(math.sqrt(-1))\nexcept:\n    print(math.sqrt(0))\nelse:\n    print(math.sqrt(1))", "try:\n    print(float('1e1'))\nexcept (NameError, SystemError):\n    print(float('1a1'))\nelse:\n    print(float('1c1'))"],ans:[0, 2],multi:true,src:"tutor-pcap",scen:false,broken:false,exp:"A and C both raise inside the `try` and catch it with a bare `except`, whose body succeeds - so nothing escapes. B and D succeed in the `try`, which means their `else` runs, and both `else` bodies raise (`int('')` and `float('1c1')`) with no handler left. An `else` block is **not** protected by the `except` above it."},
{id:1128,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"my_list=[1,2,3]\ntry:\n    my_list[3]=my_list[2]\nexcept BaseException as error:\n    print(error)",opts:["it outputs error", "it outputs <class 'IndexError'>", "it outputs list assignment index out of range", "the code is erroneous and it will not execute"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`print(error)` prints the exception's *message*, not its class. `my_list[3]` is past the end of a three-element list, so the message is `list assignment index out of range`. Printing `type(error)` is what would give you the class."},
{id:1129,d:5,o:"5.0",q:"What is the expected behaviour of this code?",c:"class E(Exception):\n    def __init__(self,message):\n        self.message=message\n    def __str__(self):\n        return 'it''s nice to see you'\ntry:\n    print('I feel fine')\n    raise Exception('what a pity')\nexcept E as e:\n    print(e)\nelse:\n    print('the show must go on')",opts:["the string 'it's nice to see you' will be seen", "the string 'the show must go on' will be printed", "the string 'I feel fine' will be printed", "nothing will be printed"],ans:[2],multi:false,src:"tutor-pcap",scen:false,broken:false,exp:"`raise Exception(...)` raises the base class, but the handler only catches `E`, so it does not match and the exception is unhandled. `'I feel fine'` has already printed by then; the `else` never runs because the `try` did not complete."},
{id:1130,d:1,o:"1.0",q:"Which of the following expressions evaluate to True?",c:null,opts:["ord('2') - ord('2') == ord('0')", "chr(ord('A')+1) == 'B'", "len('') == 1", "len('0') == ('E'*'E')"],ans:[0, 1],multi:true,src:"tutor-pcap",scen:false,broken:true,exp:"**This question is broken.** Same defective option as the other `ord` question: `ord('2') - ord('2') == ord('0')` is 0 == 48, which is **false**, and it is keyed correct. Only B is true.\n\n`chr(ord('A')+1)` is `'B'` - `ord` gives the code point, +1 moves one letter on, `chr` converts back. `'E'*'E'` would raise `TypeError`, since you cannot multiply two strings."},
{id:1131,d:1,o:"1.0",q:"Which of the following is not a version of Python?",c:null,opts:["Python 2", "Python 3", "Python X", "Python 4"],ans:[2],multi:false,src:"tutor-bcpd",scen:false,broken:false,exp:"There is no Python X. The two versions that matter are Python 2, now end-of-life, and Python 3, which is what you should be learning."},
{id:1132,d:3,o:"3.0",q:"Scenario: You are developing a game in Python and want to represent different characters as objects. Which OOP concept will you use?",c:null,opts:["Inheritance", "Encapsulation", "Polymorphism", "Abstraction"],ans:[2],multi:false,src:"tutor-bcpd",scen:false,broken:false,exp:"Unicode is a standard that assigns a number, called a code point, to every character in every writing system, plus encodings such as UTF-8 that store those numbers as bytes."},
{id:1133,d:6,o:"6.0",q:"Story: Sarah is writing a Python program that reads data from a file. Which of the following modes should she use to open the file for reading?",c:null,opts:["'w'", "'r'", "'a'", "'x'"],ans:[1],multi:false,src:"tutor-bcpd",scen:false,broken:false,exp:"A missing colon after a `class` header is a `SyntaxError`, so the file never runs."}

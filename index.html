{id:137,d:6,o:"6.4",q:"What does this print?",c:"with open(\"w.txt\", \"w\") as f:\n    n = f.write(\"abc\")\n    f.write(\"def\")\nprint(n)\nwith open(\"w.txt\") as f:\n    print(f.read())",opts:["`3` then `abcdef` - `write()` returns the number of characters written and adds no newline", "`3` then `abc\\ndef`", "`6` then `abcdef`", "`None` then `abcdef`"],ans:[0],multi:false,src:"authored",scen:false,exp:"`write()` returns the number of characters written and adds no newline of its own, so two writes run together. Add `\"\\n\"` yourself, or use `print(..., file=f)`."},
{id:138,d:6,o:"6.5",q:"What is the difference between `os.mkdir()` and `os.makedirs()`?",c:null,opts:["`mkdir` creates one directory and fails if a parent is missing; `makedirs` creates every missing parent along the way", "`mkdir` is for files and `makedirs` for directories", "`makedirs` deletes the directory if it already exists", "They are aliases of each other"],ans:[0],multi:false,src:"docs",scen:false,exp:"`mkdir` creates a single directory and raises `FileNotFoundError` if the parent chain is missing; `makedirs` builds the whole chain. Add `exist_ok=True` to `makedirs` when the directory may already be there."},
{id:139,d:6,o:"6.5",q:"Which call lists the names of the entries inside a directory?",c:null,opts:["`os.listdir(path)`", "`os.path.list(path)`", "`os.dir(path)`", "`os.readdir(path)`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`os.listdir(path)` returns the entry names - names only, not full paths, which is why joining with `os.path.join` is nearly always the next line. `os.scandir` is the richer modern alternative."},
{id:140,d:6,o:"6.6",q:"Why use `os.path.join(\"data\", \"raw\", \"a.csv\")` instead of `\"data\" + \"/\" + \"raw\" + \"/\" + \"a.csv\"`?",c:null,opts:["It inserts the separator the current operating system uses, so the same code works on Windows and on Linux", "It checks that the file exists", "It is faster", "It converts the path to an absolute path"],ans:[0],multi:false,src:"docs",scen:false,exp:"`os.path.join` uses the platform's separator, so the same source runs on Windows and on Linux. It does not touch the filesystem and does not check existence."},
{id:141,d:6,o:"6.6",q:"What do these print for a path that is an existing file?",c:"import os, tempfile\np = os.path.join(tempfile.mkdtemp(), \"f.txt\")\nopen(p, \"w\").close()\nprint(os.path.exists(p), os.path.isfile(p), os.path.isdir(p))",opts:["`True True False`", "`True False True`", "`True True True`", "`False False False`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`exists` is true for anything at that path, `isfile` narrows it to a regular file and `isdir` to a directory. For an existing file that gives True, True, False."},
{id:142,d:6,o:"6.6",q:"What does this print?",c:"import os\np = os.path.join(\"reports\", \"2026\", \"summary.csv\")\nprint(os.path.basename(p), os.path.dirname(p) != \"\", os.path.splitext(p)[1])",opts:["`summary.csv True .csv`", "`summary True .csv`", "`summary.csv True csv`", "`reports True .csv`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`basename` returns the last component, `dirname` everything before it, and `splitext` splits into stem and extension with the dot kept on the extension."},
{id:143,d:7,o:"7.1",q:"How do you get Tkinter?",c:null,opts:["It ships with the standard CPython installation - `import tkinter` works with no install step", "`pip install tkinter`", "`pip install tk`", "It must be downloaded from the Tcl website"],ans:[0],multi:false,src:"docs",scen:false,exp:"Tkinter is part of the standard library on a normal CPython install, so no `pip install` is needed - and `pip install tkinter` fails, which confuses beginners. Some Linux distributions package it separately as `python3-tk`."},
{id:144,d:7,o:"7.1",q:"What distinguishes a GUI program from a command-line program?",c:null,opts:["The user acts on visible widgets and the program responds to events, rather than reading a fixed sequence of input", "A GUI program cannot read or write files", "A GUI program runs faster", "A GUI program needs no main loop"],ans:[0],multi:false,src:"authored",scen:false,exp:"A GUI presents widgets and reacts to events in whatever order the user produces them. A command-line program follows its own fixed sequence. That inversion of control is the core idea of the domain."},
{id:145,d:7,o:"7.1",q:"What does `root.mainloop()` do?",c:null,opts:["It starts the event loop, which waits for user actions and dispatches them to handlers - the call blocks until the window closes", "It draws the window once and returns immediately", "It repeatedly redraws the window sixty times a second", "It is optional decoration"],ans:[0],multi:false,src:"docs",scen:false,exp:"`mainloop()` starts the event loop: it waits for events and dispatches them to the bound handlers, and it does not return until the window is closed. Nothing appears without it."},
{id:146,d:7,o:"7.2",q:"Match the widget to its job. Which two pairings are correct?",c:null,opts:["`Label` displays text or an image the user cannot edit", "`Entry` accepts a single line of typed text", "`Button` displays scrollable multi-line text", "`Frame` accepts numeric input only"],ans:[0, 1],multi:true,src:"docs",scen:false,exp:"`Label` shows non-editable text or an image, `Entry` takes one line of typed input. `Button` triggers a command, and `Frame` is an invisible container used to group widgets. Multi-line text is the `Text` widget."},
{id:147,d:7,o:"7.2",q:"Which call reads what the user typed into an `Entry` widget named `box`?",c:null,opts:["`box.get()`", "`box.text`", "`box.value()`", "`box.read()`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`Entry.get()` returns the current contents as a string. There is no `.text` attribute holding the value; `insert()` and `delete()` are the write side."},
{id:148,d:7,o:"7.2",q:"Which widget holds multi-line, editable text?",c:null,opts:["`Text`", "`Label`", "`Entry`", "`Message`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`Text` is the multi-line editable widget. `Label` and `Message` display text without editing, and `Entry` is single-line."},
{id:149,d:7,o:"7.3",q:"What does this pass to the button, and what is the bug?",c:"import tkinter as tk\n\ndef say_hi():\n    print(\"hi\")\n\nroot = tk.Tk()\nb = tk.Button(root, command=say_hi())",opts:["`say_hi()` calls the function immediately and passes its return value `None`; the button gets no callback. Pass `command=say_hi` with no parentheses", "It works correctly - the parentheses are required", "It raises a `TypeError` at the `Button` call", "The button will call `say_hi` twice"],ans:[0],multi:false,src:"authored",scen:false,exp:"`command=say_hi()` runs the function right there and hands the button its return value, so the message prints once at startup and the button then does nothing. Pass the function object itself: `command=say_hi`. Use `lambda: say_hi(arg)` when you need arguments."},
{id:150,d:7,o:"7.3",q:"Which method attaches a handler to an event such as a key press or a mouse click?",c:null,opts:["`widget.bind(\"<Button-1>\", handler)`", "`widget.on(\"click\", handler)`", "`widget.listen(\"<Button-1>\", handler)`", "`widget.attach(\"<Button-1>\", handler)`"],ans:[0],multi:false,src:"docs",scen:false,exp:"`bind(sequence, handler)` connects an event to a callback, with sequences such as `<Button-1>` for a left click and `<Return>` for the Enter key. The handler receives an event object."},
{id:151,d:7,o:"7.3",q:"What does \"event-driven programming\" mean?",c:null,opts:["The program sets up handlers and then waits; the order in which code runs is decided by what the user does", "The program runs its statements top to bottom and exits", "Every function is called on a timer", "Events are processed only when the program is idle"],ans:[0],multi:false,src:"authored",scen:false,exp:"In an event-driven program you register handlers and hand control to the event loop; the user decides what runs and when. That is why a GUI has no single top-to-bottom path through the code."},
{id:152,d:7,o:"7.4",q:"Which three geometry managers does Tkinter provide?",c:null,opts:["`pack`, `grid` and `place`", "`pack`, `align` and `float`", "`layout`, `grid` and `anchor`", "`row`, `column` and `cell`"],ans:[0],multi:false,src:"docs",scen:false,exp:"Tkinter has exactly three geometry managers: `pack` stacks against a side, `grid` uses rows and columns, and `place` uses explicit coordinates."},
{id:153,d:7,o:"7.4",q:"What goes wrong when you call `pack()` on one widget and `grid()` on another inside the same parent container?",c:null,opts:["Tkinter raises an error - a single container may be managed by only one geometry manager", "Both are honoured and the widgets overlap", "The second call is silently ignored", "Nothing - mixing them is the recommended approach"],ans:[0],multi:false,src:"authored",scen:false,exp:"A container may be managed by one geometry manager only; mixing `pack` and `grid` in the same parent raises `TclError`. You can still use different managers in different frames, which is the normal way to build a mixed layout."},
{id:154,d:7,o:"7.4",q:"In `widget.grid(row=1, column=2)`, what do the numbers mean?",c:null,opts:["The row and column of the cell the widget occupies in its parent's grid, counted from 0", "The pixel offset from the top-left of the window", "The width and height of the widget", "The stacking order of the widget"],ans:[0],multi:false,src:"docs",scen:false,exp:"`row` and `column` are the grid cell coordinates within the parent, numbered from zero. `sticky`, `rowspan` and `columnspan` refine the placement."},
{id:155,d:7,o:"7.4",q:"Which two statements about `pack()` are true?",c:null,opts:["It places widgets in order against one side of the container", "`side` accepts values such as `\"top\"`, `\"left\"`, `\"right\"` and `\"bottom\"`", "It positions widgets at exact pixel coordinates", "It requires `row` and `column` arguments"],ans:[0, 1],multi:true,src:"docs",scen:false,exp:"`pack` places each widget against a side of the remaining space, controlled by `side` with `top`, `left`, `right` or `bottom`. Exact coordinates are `place`, and `row`/`column` belong to `grid`."},
{id:156,d:7,o:"7.5",q:"What is `root = tk.Tk()`?",c:null,opts:["The main application window, created once and used as the parent for the other widgets", "A dialog box", "The event loop itself", "A layout manager"],ans:[0],multi:false,src:"docs",scen:false,exp:"`Tk()` creates the main window. Every other widget takes it - or a frame inside it - as its parent, and `mainloop()` is called on it. Extra windows use `Toplevel()`."},
{id:157,d:7,o:"7.5",q:"A beginner creates a `Label` and calls `mainloop()`, but the window is empty. What is missing?",c:"import tkinter as tk\nroot = tk.Tk()\nlbl = tk.Label(root, text=\"hello\")\nroot.mainloop()",opts:["The label was never handed to a geometry manager - it needs `lbl.pack()`, `lbl.grid()` or `lbl.place()`", "`Label` needs a `visible=True` argument", "`mainloop()` must be called on the label", "The text argument must be a variable"],ans:[0],multi:false,src:"authored",scen:false,exp:"Creating a widget does not display it. Until a geometry manager is called it has no place in the layout and nothing is drawn, so the window opens empty with no error. This is the most common first Tkinter bug."},
{id:158,d:1,o:"1.4",q:"A function is supposed to start with an empty list every call. Why does the second call print two items?",c:"def collect(item, bucket=[]):\n    bucket.append(item)\n    return bucket\n\nprint(collect(\"a\"))\nprint(collect(\"b\"))",opts:["The default `[]` is created once when the function is defined, so every call that omits `bucket` shares the same list — use `bucket=None` and build the list inside", "`append` returns a new list each time", "Python caches the return value of the first call", "The second call reuses the first call's argument by name"],ans:[0],multi:false,src:"authored",scen:true,exp:"A default argument is evaluated once, when the `def` runs — not on each call. So every call that omits `bucket` appends to the same list, and it grows for the life of the program. The fix is `def collect(item, bucket=None):` then `if bucket is None: bucket = []`. This is the single most-cited Python gotcha and it is worth recognising instantly."},
{id:159,d:1,o:"1.3",q:"Two lists hold the same values. Why does one comparison print `True` and the other `False`?",c:"a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b)",opts:["`==` compares the values, `is` compares identity — they are equal lists but two separate objects", "`is` is a faster spelling of `==` and this output is a bug", "`a` and `b` point at the same object, so both should be `True`", "Lists cannot be compared with `==`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`==` asks \"same value\", `is` asks \"same object in memory\". Two separately built lists are equal but not identical. Use `is` only for `None`, `True` and `False`; everywhere else you almost always mean `==`."},
{id:160,d:1,o:"1.3",q:"A price check keeps failing even though the arithmetic looks right. What is going on?",c:"total = 0.1 + 0.2\nprint(total == 0.3, round(total, 2) == 0.3)",opts:["Floats are stored in binary and `0.1 + 0.2` is very slightly more than `0.3`, so compare with rounding or a tolerance rather than `==`", "Python cannot add two floats", "`0.3` is being read as a string", "`round()` is broken for two decimal places"],ans:[0],multi:false,src:"authored",scen:true,exp:"Binary floating point cannot represent 0.1 or 0.2 exactly, so the sum is 0.30000000000000004. Never compare floats with `==`; round, or test that the difference is below a small tolerance. Money is better handled with `decimal.Decimal` or whole pence as integers."},
{id:161,d:1,o:"1.4",q:"A loop that should print three lines prints only one. What is wrong?",c:"for n in [1, 2, 3]:\n    print(n)\n    break",opts:["`break` leaves the loop on the first pass — `continue` is what skips to the next item", "`print` consumes the rest of the list", "The list needs to be wrapped in `range()`", "`break` is only valid inside `while`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`break` ends the whole loop on the first iteration. `continue` is the one that skips the rest of the current pass and moves to the next item. Mixing them up is a very common first-week error."},
{id:162,d:2,o:"2.1",q:"A script removes every `2` from a list, but one survives. Why?",c:"nums = [1, 2, 2, 3]\nfor n in nums:\n    if n == 2:\n        nums.remove(n)\nprint(nums)",opts:["Removing from a list while iterating it shifts the remaining items back, so the loop skips one — build a new list instead", "`remove()` deletes only the last match", "The loop stops as soon as it removes anything", "`remove()` needs an index, not a value"],ans:[0],multi:false,src:"authored",scen:true,exp:"The loop walks by position while `remove()` shifts everything left, so after removing index 1 the loop moves to index 2 and steps straight over the second `2`. Iterate over a copy (`for n in nums[:]`) or build a new list with a comprehension."},
{id:163,d:2,o:"2.3",q:"What happens here, and what is the fix?",c:"scores = {\"a\": 1, \"b\": 2}\ntry:\n    for k in scores:\n        if k == \"a\":\n            del scores[k]\n    print(scores)\nexcept RuntimeError as e:\n    print(\"RuntimeError\")",opts:["`RuntimeError` — a dictionary cannot change size while it is being iterated; iterate over `list(scores)` instead", "`{'b': 2}` — deleting during iteration is fine", "`KeyError`", "it loops forever"],ans:[0],multi:false,src:"authored",scen:true,exp:"Adding or deleting keys during iteration raises `RuntimeError: dictionary changed size during iteration`. Iterate over a snapshot — `for k in list(scores)` — or collect the keys to delete and remove them afterwards."},
{id:164,d:2,o:"2.2",q:"A tuple is meant to be unchangeable, so why does this work — and why does the second line still fail?",c:"t = (1, [2, 3])\nt[1].append(4)\nprint(t)\ntry:\n    {t}\nexcept TypeError:\n    print(\"unhashable\")",opts:["The tuple's own contents are fixed, but a list stored inside it can still be changed — and that mutability is why the tuple cannot be hashed", "Tuples are fully mutable", "`append` on a tuple element raises `TypeError`", "The tuple becomes a list after the append"],ans:[0],multi:false,src:"authored",scen:true,exp:"A tuple fixes *which objects* it holds, not whether those objects can change. The inner list is still mutable. And because that list is unhashable, the whole tuple becomes unhashable too, so it cannot go in a set or be a dictionary key."},
{id:165,d:2,o:"2.4",q:"Why does building this set fail, and what fixes it?",c:"try:\n    tags = {[\"a\", \"b\"], [\"c\"]}\nexcept TypeError:\n    tags = {(\"a\", \"b\"), (\"c\",)}\nprint(len(tags))",opts:["Set members must be hashable and a list is not — use tuples", "A set cannot hold more than one item of the same length", "Sets cannot hold sequences at all", "The braces make a dictionary, so it needs keys"],ans:[0],multi:false,src:"authored",scen:true,exp:"Set members must be hashable, and lists are not because they can change. Convert to tuples. The same rule governs dictionary keys — note `(\"c\",)` needs the trailing comma to be a tuple."},
{id:166,d:3,o:"3.2",q:"Two carts are created and one item is added, but both carts show it. What is wrong?",c:"class Cart:\n    items = []\n    def add(self, thing):\n        self.items.append(thing)\n\na, b = Cart(), Cart()\na.add(\"apple\")\nprint(b.items)",opts:["`items` is a class attribute shared by every instance — create it per instance with `self.items = []` inside `__init__`", "`a` and `b` are the same object", "`append` writes to every list in the program", "`self.items` is a typo for `Cart.items`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`items = []` in the class body creates one list shared by every instance, so both carts see the apple. Assign it in `__init__` with `self.items = []` and each instance gets its own. A mutable class attribute is the OOP twin of the mutable default argument in Q158."},
{id:167,d:3,o:"3.1",q:"A record has data but no behaviour, and is only ever read. What is the reasonable design call?",c:null,opts:["A dictionary or a small data class is enough — a class earns its place when data and behaviour belong together, not for grouping values alone", "Always use a class; dictionaries are never appropriate", "Always use a dictionary; classes are only for inheritance", "Use a tuple, because classes cannot hold read-only data"],ans:[0],multi:false,src:"authored",scen:true,exp:"Classes earn their place when data and the behaviour that acts on it belong together. Values with no behaviour are usually better as a dictionary or a small data class. \"Use a class for everything\" produces classes that are dictionaries with extra typing."},
{id:168,d:3,o:"3.3",q:"Why does the second instance not see the change?",c:"class Config:\n    debug = False\n\na, b = Config(), Config()\na.debug = True\nprint(a.debug, b.debug, Config.debug)",opts:["Assigning through the instance creates a new instance attribute that shadows the class attribute for that object only", "`Config.debug` is copied to each instance at creation", "`a` and `b` are the same object", "it raises an `AttributeError`"],ans:[0],multi:false,src:"authored",scen:true,exp:"Reading falls back to the class, but *writing* always creates an instance attribute. So `a.debug = True` shadows the class attribute for `a` alone, and `b` and `Config` are untouched. Set it on the class (`Config.debug = True`) if you meant it globally."},
{id:169,d:3,o:"3.6",q:"In the line `report.export(\"csv\")`, name the parts in order: `report`, `export`, and `\"csv\"`.",c:null,opts:["An instance, a method, and an argument", "A class, an attribute, and a parameter", "A module, a function, and a return value", "An object, a constructor, and an instance"],ans:[0],multi:false,src:"docs",scen:true,exp:"`report` is an instance, `export` is a method on its class, and `\"csv\"` is the argument passed to that method. The parameter is the name inside the method definition that receives it; the argument is the value at the call site."},
{id:170,d:3,o:"3.7",q:"A balance must never go negative, but this lets it. What is the encapsulation fix?",c:"class Account:\n    def __init__(self):\n        self.balance = 0\n\nacc = Account()\nacc.balance = -50\nprint(acc.balance)",opts:["Keep the value internal and expose a method or `property` that validates before assigning, so the rule cannot be bypassed by writing the attribute directly", "Rename the attribute to `__balance`, which makes it impossible to change", "Declare `balance` as `private`", "Nothing — a negative balance is not preventable in Python"],ans:[0],multi:false,src:"authored",scen:true,exp:"Encapsulation is about controlling access, not hiding names. Keep the value internal and put the rule in a `property` setter or a method, so an invalid assignment raises rather than silently succeeding. Renaming to `__balance` only mangles the name — `acc._Account__balance = -50` still works."},
{id:171,d:3,o:"3.9",q:"The subclass loses the parent's setup. What is missing?",c:"class Animal:\n    def __init__(self, name):\n        self.name = name\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        self.breed = breed\n\ntry:\n    print(Dog(\"Rex\", \"lab\").name)\nexcept AttributeError:\n    print(\"AttributeError\")",opts:["`AttributeError` — the overriding `__init__` never calls `super().__init__(name)`, so `name` is never set", "`Rex` — the parent's `__init__` runs automatically", "`TypeError` — too many arguments", "`None`"],ans:[0],multi:false,src:"authored",scen:true,exp:"Defining `__init__` in the subclass replaces the parent's; it is not added to it. Without `super().__init__(name)` the parent's setup never runs and `name` is never assigned, so the attribute lookup fails at use, far from the real cause."},
{id:172,d:3,o:"3.10",q:"A subclass sets what looks like the same private attribute, but the parent's method still returns the old value. Why?",c:"class Base:\n    def __init__(self):\n        self.__value = 1\n    def get(self):\n        return self.__value\n\nclass Child(Base):\n    def __init__(self):\n        super().__init__()\n        self.__value = 2\n\nc = Child()\nprint(c.get(), c._Base__value, c._Child__value)",opts:["`1 1 2` — the double underscore is mangled per class, so `Base` and `Child` end up with two separate attributes", "`2 2 2` — they are the same attribute", "`1 1 1`", "it raises an `AttributeError`"],ans:[0],multi:false,src:"authored",scen:true,exp:"Name mangling is per class: `Base.__value` becomes `_Base__value` and `Child.__value` becomes `_Child__value`. They are two different attributes, so `Base.get()` still reads its own. That isolation is exactly what mangling is for — it prevents a subclass clobbering a parent's internals by accident."},
{id:173,d:3,o:"3.9",q:"A subclass replaces a method but should still run the parent's version first. What does that?",c:"class Logger:\n    def write(self, msg):\n        return \"[log] \" + msg\n\nclass Timestamped(Logger):\n    def write(self, msg):\n        return super().write(\"09:00 \" + msg)\n\nprint(Timestamped().write(\"started\"))",opts:["`[log] 09:00 started` — `super().write()` calls the parent's version from inside the override", "`09:00 started` — the parent's version is discarded", "it raises a `RecursionError`", "`[log] started`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`super().write(...)` calls the parent implementation from inside the override, so the subclass can extend rather than replace. Calling `self.write(...)` instead would recurse forever."},
{id:174,d:4,o:"4.3",q:"A student saves a practice file as `random.py` in their project folder. Their other script then fails on `random.randint(1, 6)`. Why?",c:null,opts:["Their own file shadows the standard library module of the same name, because the script's own directory comes first on the import path — rename the file", "`randint` was removed from the standard library", "Two modules cannot have the same name anywhere on a machine", "The file must be deleted from `__pycache__` first"],ans:[0],multi:false,src:"authored",scen:true,exp:"The script's own directory is first on `sys.path`, so a local `random.py` is found before the standard library's. Every `import random` in that folder then gets the wrong module. Avoid naming files after standard modules — `random.py`, `string.py`, `math.py`, `email.py` are all common casualties."},
{id:175,d:4,o:"4.4",q:"A helper file prints a test line the moment another script imports it. What is missing?",c:"# helpers.py\ndef add(a, b):\n    return a + b\n\nprint(\"self test:\", add(1, 2))",opts:["The test line needs an `if __name__ == \"__main__\":` guard so it runs only when the file is executed directly", "`print` is not allowed in an imported module", "The function must be defined after the print", "The file needs to be renamed to `__main__.py`"],ans:[0],multi:false,src:"authored",scen:true,exp:"Every top-level statement runs on import. The `if __name__ == \"__main__\":` guard confines self-tests and demo output to direct execution. Without it, importing the module for one function drags along all of its side effects."},
{id:176,d:4,o:"4.5",q:"A folder `utils/` holds `dates.py`, but `from utils.dates import today` raises `ModuleNotFoundError`. What is the most likely cause in the traditional package layout?",c:null,opts:["`utils/` has no `__init__.py`, or the folder containing `utils/` is not on the import path", "`dates.py` must be renamed `__init__.py`", "Packages cannot contain modules", "The import must be written `import utils/dates`"],ans:[0],multi:false,src:"docs",scen:true,exp:"In the traditional layout `utils/` needs an `__init__.py`, and the directory that *contains* `utils/` has to be on the import path — usually because it is the script's own folder. Namespace packages can go without `__init__.py`, but at this level the missing file is the likelier cause."},
{id:177,d:4,o:"4.7",q:"A beginner treats a NumPy array like a list and it does not work. Why does `append` fail?",c:"import numpy as np\na = np.array([1, 2, 3])\nb = np.append(a, 4)\nprint(hasattr(a, \"append\"), a, b)",opts:["`False [1 2 3] [1 2 3 4]` — an array has a fixed size, so there is no in-place `append`; `np.append` builds a whole new array", "`True [1 2 3 4] [1 2 3 4]`", "it raises an `AttributeError`", "`False [1 2 3 4] [1 2 3 4]`"],ans:[0],multi:false,src:"authored",scen:true,exp:"An array occupies a fixed block of memory with a fixed size, so there is nothing to append to in place. `np.append` allocates a new array and copies — fine occasionally, expensive in a loop. Collect into a Python list and convert once."},
{id:178,d:4,o:"4.8",q:"Two arrays of different lengths are added and it fails. What does the error mean?",c:"import numpy as np\ntry:\n    print(np.array([1, 2, 3]) + np.array([10, 20]))\nexcept ValueError:\n    print(\"ValueError\")",opts:["`ValueError` — element-wise operations need compatible shapes, and 3 elements cannot line up with 2", "`[11 22 3]` — the shorter array is padded", "`[11 22]` — the longer array is trimmed", "`[1 2 3 10 20]` — they are joined"],ans:[0],multi:false,src:"authored",scen:true,exp:"Element-wise operations require the shapes to be compatible; broadcasting can stretch a dimension of size 1, but 3 against 2 has no valid alignment, so it raises. This is not concatenation — `np.concatenate` is what joins arrays."},
{id:179,d:4,o:"4.9",q:"A tally of exam marks comes out wrong. What is the difference between these two lines?",c:"import numpy as np\nmarks = np.array([[60, 70], [80, 90]])\nprint(marks.mean(), marks.mean(axis=1))",opts:["`75.0 [65. 85.]` — with no axis the mean is over every element; `axis=1` collapses the columns, giving one mean per row", "`75.0 [70. 80.]`", "`[65. 85.] 75.0`", "`150.0 [65. 85.]`"],ans:[0],multi:false,src:"authored",scen:true,exp:"With no axis the mean is taken over every element: (60+70+80+90)/4 = 75.0. `axis=1` collapses across the columns, giving a mean per row: 65 and 85. Read the axis as \"the one that disappears\"."},
{id:180,d:4,o:"4.2",q:"A timestamp is needed in the format `2026-08-25`. Which is correct?",c:"from datetime import datetime\nd = datetime(2026, 8, 25, 14, 30)",opts:["`d.strftime(\"%Y-%m-%d\")`", "`d.strftime(\"%y-%M-%D\")`", "`d.format(\"YYYY-MM-DD\")`", "`str(d.date)`"],ans:[0],multi:false,src:"docs",scen:true,exp:"`%Y` four-digit year, `%m` zero-padded month, `%d` zero-padded day. `%y` is the two-digit year and `%M` is minutes, so option B silently produces something plausible and wrong — the worst kind of mistake in a timestamp."},
{id:181,d:5,o:"5.2",q:"A script silently does nothing and nobody can work out why. What is wrong with the error handling?",c:"def load(values):\n    try:\n        return sum(valeus)\n    except:\n        return None\n\nprint(load([1, 2, 3]))",opts:["`None` — the bare `except` swallows a `NameError` caused by the typo `valeus`, hiding a bug that has nothing to do with the data", "`6` — Python corrects the misspelling", "it raises a `NameError`", "`0`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`valeus` is a typo, which raises `NameError` — and the bare `except` catches it along with everything else, converting a crash that would have named the line into a silent `None`. Catch the specific exception you expect, and let the ones you did not expect surface."},
{id:182,d:5,o:"5.2",q:"What does this return, and why is it a trap?",c:"def f():\n    try:\n        return \"try\"\n    finally:\n        return \"finally\"\n\nprint(f())",opts:["`finally` — a `return` inside `finally` replaces the one from the `try`, which silently discards the real result", "`try`", "`None`", "it raises a `SyntaxError`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`finally` always runs, and a `return` inside it overrides the value the `try` was about to return. The real result vanishes with no error. Never `return` from `finally` — use it for cleanup only."},
{id:183,d:5,o:"5.1",q:"A handler is meant to catch a bad number but never fires. Why?",c:"try:\n    n = int(\"twelve\")\nexcept TypeError:\n    print(\"caught\")\nexcept ValueError:\n    print(\"value\")",opts:["`value` — the wrong class was tried first; a string that is not a number raises `ValueError`, not `TypeError`", "`caught`", "nothing is printed", "it raises an unhandled exception"],ans:[0],multi:false,src:"authored",scen:true,exp:"`int(\"twelve\")` gets an acceptable *type* with an unusable *value*, so it raises `ValueError`. The `TypeError` clause is simply never reached. Predicting the exception class is most of writing a handler that works."},
{id:184,d:5,o:"5.4",q:"A custom exception should carry the offending value so the handler can report it. Which works?",c:"class BadTemp(Exception):\n    pass\n\ntry:\n    raise BadTemp(-40)\nexcept BadTemp as e:\n    print(e.args[0], str(e))",opts:["`-40 -40` — the inherited `__init__` stores whatever it is raised with in `args`", "it raises a `TypeError` because the class defines no `__init__`", "`None None`", "`BadTemp -40`"],ans:[0],multi:false,src:"authored",scen:true,exp:"Subclassing `Exception` with an empty body still inherits an `__init__` that stores its arguments in `args`, and `str(e)` returns the single argument. You only need a custom `__init__` when you want extra structured fields."},
{id:185,d:6,o:"6.4",q:"A script writes a report, but the file is empty when another program reads it a moment later. What is missing?",c:"f = open(\"report.txt\", \"w\")\nf.write(\"done\")\nprint(open(\"report.txt\").read())\nf.close()\nprint(open(\"report.txt\").read())",opts:["an empty line then `done` — the text sits in a buffer until the file is closed, which is exactly what `with` guarantees", "`done` then `done`", "it raises a `ValueError`", "an empty line twice"],ans:[0],multi:false,src:"authored",scen:true,exp:"Writes are buffered and are not guaranteed to reach disk until the file is closed or flushed, so the first read sees an empty file. `with open(...) as f:` closes on the way out including on exception, which is why it is the default advice."},
{id:186,d:6,o:"6.2",q:"A script works from its own folder and fails from anywhere else. Which fix is correct?",c:null,opts:["Build the path from the script's own location, for example `os.path.join(os.path.dirname(os.path.abspath(__file__)), \"data.txt\")`", "Always call `os.chdir()` to the user's home directory first", "Use `open(\"./data.txt\")`, which is always relative to the script", "Move the file to the Python installation directory"],ans:[0],multi:false,src:"authored",scen:true,exp:"A relative path resolves against the current working directory, which is wherever the process was launched — not the script's folder. `__file__` gives the script's own location, and building the path from it makes the script runnable from anywhere. `./data.txt` is still relative to the working directory, so option C changes nothing."},
{id:187,d:6,o:"6.5",q:"A script lists a folder and then opens each file, and it fails with `FileNotFoundError` unless it is run from inside that folder. Why?",c:"import os, tempfile\nd = tempfile.mkdtemp()\nopen(os.path.join(d, \"a.txt\"), \"w\").close()\nprint(os.listdir(d))",opts:["`os.listdir()` returns bare names, not paths — rejoin each one with `os.path.join(d, name)` before opening it", "`os.listdir()` returns absolute paths and the script is corrupting them", "`os.listdir()` cannot see files created in the same script", "The folder must be added to `sys.path`"],ans:[0],multi:false,src:"docs",scen:true,exp:"`os.listdir()` returns bare entry names. Opening one only works while the working directory happens to be that folder. Rejoin with `os.path.join(directory, name)` — or use `os.scandir()`, whose entries carry a usable `.path`."},
{id:188,d:7,o:"7.5",q:"A form reads the entry box the moment the window is built and always gets an empty string. Why?",c:null,opts:["The read happens before the event loop starts, so the user has not typed anything yet — read the value inside the button's callback instead", "`Entry.get()` only works after `destroy()`", "`Entry` needs `readable=True`", "The entry must be packed twice"],ans:[0],multi:false,src:"authored",scen:true,exp:"Widget code runs to completion *before* `mainloop()` starts accepting input, so a read at build time happens before the user has typed. Read the value inside the callback, which runs in response to the click. This is the practical consequence of event-driven control flow."},
{id:189,d:7,o:"7.4",q:"A window is meant to show a label and a button side by side in a row, then a status bar underneath spanning both. Which manager fits without fighting?",c:null,opts:["`grid`, placing the two widgets at row 0 columns 0 and 1 and the status bar at row 1 with `columnspan=2`", "`place`, with pixel coordinates for all three", "`pack` with `side=\"left\"` for all three", "Mixing `grid` for the row and `pack` for the status bar in the same container"],ans:[0],multi:false,src:"authored",scen:true,exp:"`grid` is built for rows and columns, and `columnspan=2` is exactly how one widget stretches across both. `pack` with `side=\"left\"` would put the status bar beside them, not under. Option D is the error from Q153 — one container, one geometry manager."},
{id:190,d:7,o:"7.3",q:"A button is built inside a function and the window shows it, but clicking it does nothing and no error appears. Which is the most likely cause?",c:null,opts:["`command` was given the *result* of calling the handler rather than the handler itself, so the button holds `None`", "Buttons cannot be created inside a function", "`mainloop()` must be called on the button", "The button needs `clickable=True`"],ans:[0],multi:false,src:"authored",scen:true,exp:"`command=handler()` runs the function immediately and hands the button its return value, usually `None` — so the button is wired to nothing and clicking is silent. Pass the function object: `command=handler`, or `command=lambda: handler(arg)` when arguments are needed. Silent failure is what makes it hard to spot."}

<script>
"use strict";
/* ============================================================ constants */
const DOMAINS = {
  1:"Introduction and Setup", 2:"Data Structures", 3:"Object-Oriented Programming",
  4:"Modules and Libraries", 5:"Debugging and Error Handling", 6:"File Handling",
  7:"GUI Programming"
};
// Blueprint weights from the objectives PDF, resolved to whole questions.
// 20/15/15/15/15/10/10 of 90 -> 18/14/13/14/13/9/9. Fixed so a run is reproducible.
const EXAM_DRAW = {1:18, 2:14, 3:13, 4:14, 5:13, 6:9, 7:9};
const EXAM_MINUTES = 120;
const LETTERS = "ABCDEFG";
const LS = "bcpd.v1";

/* ============================================================ state */
const store = {
  seen:{},          // id -> {right:bool, picks:[]}
  run:null,         // {mode, ids, i, picks:{}, order:{}, started, submitted}
  ai:"claude",      // which assistant the Ask button hands off to
  aiPrivate:false,  // use the platform's temporary-chat link where one exists
};
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){
      const d = JSON.parse(raw);
      store.seen = d.seen||{}; store.run = d.run||null;
      if(AI_TARGETS[d.ai]) store.ai = d.ai;
      store.aiPrivate = !!d.aiPrivate;
    }
  }catch(e){}
}

/* ============================================================ helpers */
const el = (t, cls, txt) => { const n = document.createElement(t); if(cls) n.className = cls; if(txt!=null) n.textContent = txt; return n; };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// Inline `code` spans in stems and explanations. Escape first, so the source text can
// never inject markup - the bank is trusted but this keeps the rule simple.
const md = s => esc(s).replace(/`([^`]+)`/g, (_,c)=>`<code>${c}</code>`);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));

/* ============================================================ selection */
let filters = { mode:"study", domains:new Set(), objs:new Set(), scenario:false };

function pool(){
  let qs = QS.slice();
  if(filters.domains.size) qs = qs.filter(q => filters.domains.has(q.d));
  if(filters.objs.size)    qs = qs.filter(q => filters.objs.has(q.o));
  if(filters.scenario)     qs = qs.filter(q => q.scen);
  return qs;
}
function buildSet(mode){
  if(mode === "exam"){
    // Draw to blueprint weight regardless of how the pool is distributed. Filters are
    // deliberately ignored here - a weighted simulation of a filtered pool is not a
    // simulation of the exam.
    const out = [];
    for(const d of Object.keys(EXAM_DRAW)){
      const bucket = shuffle(QS.filter(q => q.d === +d));
      const want = EXAM_DRAW[d];
      out.push(...bucket.slice(0, want).map(q=>q.id));
      if(bucket.length < want) console.warn(`domain ${d}: only ${bucket.length} of ${want}`);
    }
    return shuffle(out);
  }
  if(mode === "wrong"){
    return shuffle(QS.filter(q => store.seen[q.id] && store.seen[q.id].right === false).map(q=>q.id));
  }
  return shuffle(pool().map(q=>q.id));
}

/* ============================================================ views */
const work = document.getElementById("work");
const foot = document.getElementById("foot");
const hmeta = document.getElementById("hmeta");
const fmeta = document.getElementById("fmeta");
const mainBtn = document.getElementById("mainBtn");
const skipBtn = document.getElementById("skipBtn");

function renderSetup(){
  foot.hidden = true;
  hmeta.textContent = "";
  work.innerHTML = "";

  if(store.run && !store.run.submitted){
    const r = store.run;
    const c = el("div","card");
    c.append(el("h2",null,"You have a run in progress"));
    const done = Object.keys(r.picks).length;
    c.append(el("p",null,`${modeName(r.mode)} — question ${r.i+1} of ${r.ids.length}, ${done} answered.`));
    const row = el("div","row");
    const res = el("button","btn primary","Resume"); res.onclick = () => renderQuestion();
    const dis = el("button","btn quiet","Discard");
    dis.onclick = () => { if(confirm("Discard this run? Your answered questions stay in your history, but this run's position is lost.")){ store.run = null; save(); renderSetup(); } };
    row.append(res, dis); c.append(row);
    work.append(c);
  }

  const m = el("div","card");
  m.append(el("h2",null,"Choose a mode"));
  const modes = el("div","modes");
  const wrongCount = QS.filter(q => store.seen[q.id] && store.seen[q.id].right===false).length;
  const defs = [
    ["study","Study","Answer, see the explanation immediately, ask the tutor. Filters below apply."],
    ["exam","Exam simulation",`90 questions, ${EXAM_MINUTES} minutes, drawn to the blueprint weights. No feedback until the end.`],
    ["wrong","My wrong answers",`${wrongCount} question${wrongCount===1?"":"s"} you have got wrong.`]
  ];
  for(const [id,title,sub] of defs){
    const b = el("button","mode"); b.type="button";
    b.setAttribute("aria-pressed", String(filters.mode===id));
    b.append(el("b",null,title), el("small",null,sub));
    if(id==="wrong" && wrongCount===0) b.disabled = true;
    b.onclick = () => { filters.mode = id; renderSetup(); };
    modes.append(b);
  }
  m.append(modes);

  const start = el("button","btn primary","Start");
  start.style.marginTop = "12px";
  start.onclick = () => {
    const ids = buildSet(filters.mode);
    if(!ids.length){ alert("That selection has no questions in it."); return; }
    store.run = { mode:filters.mode, ids, i:0, picks:{}, order:{}, started:Date.now(), submitted:false };
    save(); renderQuestion();
  };
  m.append(start);
  work.append(m);

  if(filters.mode === "study"){
    const f = el("div","card");
    f.append(el("h3",null,"Filter the pool"));
    f.append(el("span","lbl","Domain"));
    const dch = el("div","chips");
    for(const d of Object.keys(DOMAINS)){
      const n = QS.filter(q=>q.d===+d).length;
      const c = el("button","chip",`${d}. ${DOMAINS[d]} · ${n}`); c.type="button";
      c.setAttribute("aria-pressed", String(filters.domains.has(+d)));
      c.onclick = () => { filters.domains.has(+d) ? filters.domains.delete(+d) : filters.domains.add(+d); filters.objs.clear(); renderSetup(); };
      dch.append(c);
    }
    f.append(dch);

    // Objectives only appear once a domain is chosen: 45 chips at once is noise.
    if(filters.domains.size){
      f.append(el("span","lbl","Sub-objective"));
      const och = el("div","chips");
      const objs = [...new Set(QS.filter(q=>filters.domains.has(q.d)).map(q=>q.o))].sort(
        (a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      for(const o of objs){
        const n = QS.filter(q=>q.o===o).length;
        const c = el("button","chip",`${o} · ${n}`); c.type="button";
        c.setAttribute("aria-pressed", String(filters.objs.has(o)));
        c.onclick = () => { filters.objs.has(o) ? filters.objs.delete(o) : filters.objs.add(o); renderSetup(); };
        och.append(c);
      }
      f.append(och);
    }
    f.append(el("span","lbl","Format"));
    const fch = el("div","chips");
    const sc = el("button","chip",`Scenario questions only · ${QS.filter(q=>q.scen).length}`);
    sc.type = "button";
    sc.setAttribute("aria-pressed", String(filters.scenario));
    sc.onclick = () => { filters.scenario = !filters.scenario; renderSetup(); };
    fch.append(sc);
    f.append(fch);
    f.append(el("p","note",`${pool().length} of ${QS.length} questions selected.`));
    work.append(f);
  }

  const s = el("div","card");
  s.append(el("h3",null,"Progress"));
  const answered = Object.keys(store.seen).length;
  const right = Object.values(store.seen).filter(v=>v.right).length;
  if(!answered){
    s.append(el("p","empty","Nothing answered yet. Pick a mode above and start."));
  } else {
    s.append(el("p",null,`${right} correct out of ${answered} answered (${Math.round(right/answered*100)}%).`));
    const t = el("table");
    t.innerHTML = `<caption>By domain</caption><tr><th>Domain</th><th class="n">Answered</th><th class="n">Correct</th></tr>`;
    for(const d of Object.keys(DOMAINS)){
      const ids = QS.filter(q=>q.d===+d).map(q=>q.id).filter(id=>store.seen[id]);
      const ok = ids.filter(id=>store.seen[id].right).length;
      const tr = el("tr");
      tr.innerHTML = `<td>${d}. ${DOMAINS[d]}</td><td class="n">${ids.length}</td><td class="n">${ids.length?ok:"—"}</td>`;
      t.append(tr);
    }
    s.append(t);
    const reset = el("button","btn quiet tiny","Reset all progress");
    reset.style.marginTop="12px";
    reset.onclick = () => {
      if(confirm("Reset all progress? This erases every answer you have recorded and your wrong-answer list. It cannot be undone.")){
        store.seen = {}; store.run = null; save(); renderSetup();   // keeps the Ask AI choice
      }
    };
    s.append(reset);
  }
  work.append(s);

  const st = el("div","card");
  st.append(el("h3",null,"Ask AI with"));
  // Private chat can only be honoured where the platform exposes it by URL. If the
  // current pick cannot, fall back rather than silently ignoring the setting.
  if(store.aiPrivate && !AI_TARGETS[store.ai].priv) store.ai = "claude";
  const ach = el("div","chips");
  for(const k of Object.keys(AI_TARGETS)){
    const t = AI_TARGETS[k];
    const off = store.aiPrivate && !t.priv;
    const c = el("button","chip",t.name); c.type = "button";
    c.setAttribute("aria-pressed", String(store.ai === k));
    if(off){ c.disabled = true; c.title = t.privHint || "No temporary chat reachable by link."; }
    c.onclick = () => { store.ai = k; save(); renderSetup(); };
    ach.append(c);
  }
  const pc = el("button","chip toggle","Private chat"); pc.type = "button";
  pc.setAttribute("aria-pressed", String(store.aiPrivate));
  pc.onclick = () => { store.aiPrivate = !store.aiPrivate; save(); renderSetup(); };
  ach.append(pc);
  st.append(ach);
  const cur = AI_TARGETS[store.ai];
  st.append(el("p","note", store.aiPrivate
    ? "Only Claude and ChatGPT expose a temporary chat by link, so the others are unavailable while this is on. A web page cannot force a browser incognito window — that is a browser restriction, not a missing feature."
    : (cur.prefill
        ? "The question is copied to your clipboard and also sent in the URL."
        : cur.noPrefillHint + " It is copied to your clipboard automatically.")));
  work.append(st);

  const a = el("div","card");
  a.append(el("h3",null,"About this bank"));
  a.append(el("p","note",`${QS.length} questions across all 45 sub-objectives of the official BeingCert objectives document, including ${QS.filter(q=>q.scen).length} scenario questions. Every question containing code is executed by the build and its answer asserted against what CPython 3.12 actually does — if an answer disagreed with the interpreter, the build would fail rather than ship.`));
  work.append(a);
}

function modeName(m){ return m==="exam" ? "Exam simulation" : m==="wrong" ? "My wrong answers" : "Study"; }

/* ============================================================ question view */
function currentQ(){ const r = store.run; return QS.find(q=>q.id===r.ids[r.i]); }

function optOrder(q){
  const r = store.run;
  // Shuffle once per run and remember it. Without this, re-drilling teaches "the answer
  // is B" instead of the content. Picks are stored as original indices so the record
  // survives the shuffle.
  if(!r.order[q.id]) { r.order[q.id] = shuffle(q.opts.map((_,i)=>i)); save(); }
  return r.order[q.id];
}

function renderQuestion(){
  const r = store.run;
  if(!r){ renderSetup(); return; }
  if(r.i >= r.ids.length){ renderResults(); return; }
  const q = currentQ();
  const order = optOrder(q);
  const picked = r.picks[q.id];               // array of original indices, or undefined
  const isExam = r.mode === "exam";
  const locked = picked !== undefined && !isExam;

  foot.hidden = false;
  work.innerHTML = "";
  window.scrollTo(0,0);

  const bar = el("div","pbar");
  const fill = el("i"); fill.style.transform = `scaleX(${(r.i)/r.ids.length})`;
  bar.append(fill); work.append(bar);

  const head = el("div","qhead");
  head.append(el("span","tag",`Q${q.id}`), el("span","tag",`${q.d}. ${DOMAINS[q.d]}`), el("span","tag",`obj ${q.o}`));
  if(q.multi) head.append(el("span","tag",`choose ${q.ans.length}`));
  if(q.scen)  head.append(el("span","tag","scenario"));
  work.append(head);

  const stem = el("div","stem"); stem.innerHTML = md(q.q); work.append(stem);

  if(q.c){
    const pre = el("pre"); const code = el("code"); code.textContent = q.c;
    pre.append(code); work.append(pre);
  }

  const fs = el("fieldset","opts");
  fs.append(Object.assign(el("legend"),{className:"skip",textContent:"Answer options"}));
  const inputs = [];
  order.forEach((origIdx, shownAt) => {
    const lab = el("label","opt");
    const inp = document.createElement("input");
    inp.type = q.multi ? "checkbox" : "radio";
    inp.name = "opt"; inp.value = String(origIdx);
    inp.disabled = locked;
    if(picked && picked.includes(origIdx)) inp.checked = true;
    inputs.push(inp);
    lab.append(inp, el("span","k",LETTERS[shownAt]+"."));
    const t = el("span","txt"); t.innerHTML = md(q.opts[origIdx]);
    lab.append(t);
    if(locked){
      lab.classList.add("locked");
      if(q.ans.includes(origIdx)) lab.classList.add("is-right");
      else if(picked.includes(origIdx)) lab.classList.add("is-wrong");
    }
    inp.onchange = () => { mainBtn.disabled = !inputs.some(x=>x.checked); };
    fs.append(lab);
  });
  work.append(fs);

  if(locked){
    const right = same(picked, q.ans);
    const v = el("p", "verdict " + (right?"right":"wrong"), right ? "Correct" : "Not quite");
    work.append(v);
    const why = el("div","why"); why.innerHTML = md(q.exp); work.append(why);
    work.append(tutorBlock(q, picked));
  }

  // Footer controls
  fmeta.textContent = isExam
    ? `${r.i+1}/${r.ids.length} · ${timeLeft()}`
    : `${r.i+1}/${r.ids.length}`;
  skipBtn.hidden = locked;
  mainBtn.textContent = locked ? (r.i+1 >= r.ids.length ? "Finish" : "Next") : (isExam ? (r.i+1>=r.ids.length ? "Finish" : "Save and next") : "Check");
  mainBtn.disabled = !locked && !inputs.some(x=>x.checked);

  mainBtn.onclick = () => {
    if(locked){ r.i++; save(); renderQuestion(); return; }
    const chosen = inputs.filter(x=>x.checked).map(x=>+x.value).sort((a,b)=>a-b);
    if(!chosen.length) return;
    r.picks[q.id] = chosen;
    const right = same(chosen, q.ans);
    store.seen[q.id] = { right, picks:chosen };
    save();
    if(isExam){ r.i++; save(); if(r.i>=r.ids.length) renderResults(); else renderQuestion(); }
    else renderQuestion();
  };
  skipBtn.onclick = () => { r.i++; save(); if(r.i>=r.ids.length) renderResults(); else renderQuestion(); };
}

/* ============================================================ exam timer */
let tick = null;
function timeLeft(){
  const r = store.run;
  const ms = r.started + EXAM_MINUTES*60000 - Date.now();
  if(ms <= 0) return "0:00";
  const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000);
  return `${m}:${String(s).padStart(2,"0")}`;
}
function startTick(){
  clearInterval(tick);
  tick = setInterval(() => {
    const r = store.run;
    if(!r || r.mode!=="exam" || r.submitted){ return; }
    const ms = r.started + EXAM_MINUTES*60000 - Date.now();
    hmeta.textContent = "Time " + timeLeft();
    if(!foot.hidden) fmeta.textContent = `${Math.min(r.i+1,r.ids.length)}/${r.ids.length} · ${timeLeft()}`;
    if(ms <= 0) renderResults();
  }, 1000);
}

/* ============================================================ tutor handoff */
// No API key, no backend. The question is handed to whichever assistant the user already
// has open, as a prefilled prompt. Prefill support is uneven and changes without notice,
// so every handoff ALSO copies to the clipboard - that is the only route that works
// everywhere, and it matters more here than in a hosted app because this file is meant to
// be opened from disk.
const AI_TARGETS = {
  claude: {
    name:"Claude", prefill:true,
    url:q => "https://claude.ai/new?q=" + encodeURIComponent(q),
    priv:q => "https://claude.ai/new?incognito=true&q=" + encodeURIComponent(q),
  },
  chatgpt: {
    name:"ChatGPT", prefill:true,
    url:q => "https://chatgpt.com/?q=" + encodeURIComponent(q),
    priv:q => "https://chatgpt.com/?temporary-chat=true&q=" + encodeURIComponent(q),
  },
  perplexity: {
    name:"Perplexity", prefill:true,
    url:q => "https://www.perplexity.ai/search?q=" + encodeURIComponent(q),
    priv:null,
    privHint:"Perplexity's incognito is an in-app shortcut (Ctrl ;), so a link cannot open it.",
  },
  gemini: {
    name:"Gemini", prefill:false,
    url:() => "https://gemini.google.com/app",
    priv:null,
    privHint:"Gemini has no incognito mode reachable by link.",
    noPrefillHint:"Gemini accepts no prompt from a URL, so the question has to be pasted in.",
  },
};
// Browsers and receiving apps both truncate very long URLs. Past this, hand over by
// clipboard only rather than opening a silently cut-off prompt.
const URL_PROMPT_CAP = 6000;

function buildPrompt(q, picked){
  const chosen  = picked.map(i => `${LETTERS[i]}. ${q.opts[i]}`).join("; ");
  const correct = q.ans.map(i => `${LETTERS[i]}. ${q.opts[i]}`).join("; ");
  const right   = same(picked, q.ans);
  const askFor  = right
    ? "I got this right. Go one level deeper: what related thing do beginners get wrong here, and what would a harder version look like?"
    : "I got this wrong. Explain what I was probably thinking, why it is wrong, and the one rule to remember.";
  return [
    "I am a beginner studying for the BeingCert Certified Python Developer (BCPD) exam.",
    "Please keep it under 150 words and explain any jargon you use.",
    "",
    `QUESTION (objective ${q.o}, ${DOMAINS[q.d]}):`,
    q.q,
    q.c ? "\n" + q.c : "",
    "",
    "OPTIONS:",
    q.opts.map((o,i)=>`${LETTERS[i]}. ${o}`).join("\n"),
    "",
    `THE CORRECT ANSWER IS: ${correct}`,
    `I CHOSE: ${chosen}`,
    "",
    `The answer above was verified by running the code, so please do not contradict it. ${askFor}`
  ].filter(x => x !== "").join("\n");
}

async function copyPrompt(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    // The clipboard API needs a secure context, and this file is meant to be opened
    // from disk over file:// where there isn't one. Fall back to the old selection copy.
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    }catch(e2){ return false; }
  }
}

function tutorBlock(q, picked){
  const box = el("div","tutor");
  box.append(Object.assign(el("h4"),{textContent:"Ask AI about this question"}));

  const t = AI_TARGETS[store.ai] || AI_TARGETS.claude;
  const prompt = buildPrompt(q, picked);
  const tooLong = encodeURIComponent(prompt).length > URL_PROMPT_CAP;
  const canPrefill = t.prefill && !tooLong;

  const row = el("div","row");
  const go = el("button","btn tiny", canPrefill ? `Ask ${t.name}` : `Copy for ${t.name}`);
  go.type = "button";
  const status = el("span","tag");
  const open = el("button","btn tiny", `Open ${t.name}`);
  open.type = "button"; open.hidden = true;
  open.onclick = () => window.open(t.url(prompt), "_blank", "noopener,noreferrer");
  row.append(go, open, status);
  box.append(row);

  go.onclick = async () => {
    const copied = await copyPrompt(prompt);
    if(canPrefill){
      const url = (store.aiPrivate && t.priv) ? t.priv(prompt) : t.url(prompt);
      window.open(url, "_blank", "noopener,noreferrer");
      status.textContent = copied
        ? `Opened ${t.name} — also copied, paste it if the tab came up empty.`
        : `Opened ${t.name}.`;
      return;
    }
    // No prefill possible. Do NOT open the tab yet: a new tab steals focus and the user
    // would never see a note telling them to paste. Copy, say so, then let them open it.
    if(copied){
      status.textContent = "Copied — now open it and paste.";
      open.hidden = false;
    }else{
      const ta = el("textarea"); ta.value = prompt; ta.readOnly = true;
      ta.setAttribute("aria-label","Prompt to copy");
      box.append(ta); ta.select();
      status.textContent = "Select the text above, copy it, then open it.";
      open.hidden = false;
    }
  };

  box.append(el("p","note", tooLong
    ? `This question is too long to travel in a link, so it is copied instead — paste it into ${t.name}.`
    : (t.prefill
        ? "Opens in a new tab with the question already filled in, and copies it as well."
        : t.noPrefillHint)));
  return box;
}

/* ============================================================ results */
function renderResults(){
  const r = store.run;
  r.submitted = true; save();
  clearInterval(tick);
  foot.hidden = true; hmeta.textContent = "";
  work.innerHTML = "";

  const answered = r.ids.filter(id => r.picks[id] !== undefined);
  const right = answered.filter(id => same(r.picks[id], QS.find(q=>q.id===id).ans));
  const pct = answered.length ? Math.round(right.length/r.ids.length*100) : 0;

  const c = el("div","card");
  c.append(el("h2",null, modeName(r.mode) + " — result"));
  c.append(el("div","score", `${pct}%`));
  c.append(el("p","note", `${right.length} correct of ${r.ids.length}. ${r.ids.length - answered.length} left unanswered.`));
  if(r.mode==="exam"){
    c.append(el("p","note", pct>=70
      ? "Above the 70% the objectives document states as the pass mark. Treat that as a working target, not a guarantee."
      : "Below the stated 70% pass mark. The table below shows where the marks went."));
  }
  work.append(c);

  const t = el("table");
  t.innerHTML = `<caption>Where the marks went</caption><tr><th>Domain</th><th class="n">Asked</th><th class="n">Correct</th></tr>`;
  for(const d of Object.keys(DOMAINS)){
    const ids = r.ids.filter(id => QS.find(q=>q.id===id).d === +d);
    if(!ids.length) continue;
    const ok = ids.filter(id => r.picks[id] && same(r.picks[id], QS.find(q=>q.id===id).ans)).length;
    const tr = el("tr");
    tr.innerHTML = `<td>${d}. ${DOMAINS[d]}</td><td class="n">${ids.length}</td><td class="n">${ok}</td>`;
    t.append(tr);
  }
  const wrap = el("div","card"); wrap.append(t);

  const missed = r.ids.filter(id => r.picks[id] && !same(r.picks[id], QS.find(q=>q.id===id).ans));
  const row = el("div","row"); row.style.marginTop = "12px";
  if(missed.length){
    const rev = el("button","btn primary",`Review the ${missed.length} you missed`);
    rev.onclick = () => { store.run = { mode:"wrong", ids:shuffle(missed), i:0, picks:{}, order:{}, started:Date.now(), submitted:false }; save(); renderQuestion(); };
    row.append(rev);
  }
  const back = el("button","btn quiet","Back to setup");
  back.onclick = () => { store.run = null; save(); renderSetup(); };
  row.append(back);
  wrap.append(row);
  work.append(wrap);
}

/* ============================================================ boot */
document.getElementById("setupBtn").onclick = () => {
  clearInterval(tick);
  renderSetup();
};
document.addEventListener("keydown", e => {
  if(!store.run || store.run.submitted) return;
  if(e.key === "Enter" && !e.shiftKey && document.activeElement.tagName !== "TEXTAREA"){
    if(!mainBtn.disabled && !foot.hidden){ e.preventDefault(); mainBtn.click(); }
  }
});

load();
if(store.run && store.run.mode === "exam" && !store.run.submitted) startTick();
renderSetup();
</script>
</body>
</html>
